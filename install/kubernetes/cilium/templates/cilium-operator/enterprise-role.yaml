{{- if and .Values.operator.enabled .Values.serviceAccounts.operator.create .Values.enterprise.loadbalancer.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cilium-operator-slb-secrets
  namespace: {{ .Values.envoyConfig.secretsNamespace.name | quote }}
  {{- with .Values.operator.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/part-of: cilium
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - update
  - patch
{{- end }}

{{- if and
    .Values.operator.enabled
    .Values.serviceAccounts.operator.create
    .Values.enterprise.privateNetworks.autoExternalEndpoints
    .Values.enterprise.privateNetworks.autoExternalEndpoints.enabled
}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cilium-private-networks-secrets
  namespace: {{ .Values.enterprise.privateNetworks.autoExternalEndpoints.secretsNamespace.name | quote }}
  {{- with .Values.operator.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/part-of: cilium
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
{{- end }}

