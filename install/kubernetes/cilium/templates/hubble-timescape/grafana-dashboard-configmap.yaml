{{- if and .Values.hubble.timescape.enabled .Values.hubble.timescape.grafana.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-timescape-grafana-dashboard
  namespace: {{ .Values.hubble.timescape.grafana.dashboards.namespace | default (include "cilium.namespace" .) }}
  labels:
    {{/* The timescape labels already contain the .Values.commonLabels */}}
    {{- include "hubble.timescape.labels" . | nindent 4 }}
    {{- with .Values.hubble.timescape.grafana.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $annotations := mergeOverwrite (dict)
    .Values.hubble.timescape.annotations
    .Values.hubble.timescape.grafana.dashboards.annotations
  }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
{{ (.Files.Glob "files/hubble-timescape/dashboards/*.json").AsConfig | indent 2 }}
{{- end }}
