{{- if and .Values.hubble.enabled .Values.hubble.tls.enabled .Values.hubble.tls.auto.enabled (eq .Values.hubble.tls.auto.method "cronJob") .Values.serviceAccounts.hubblecertgen.create .Values.rbac.create }}
{{- if eq (include "hubble.timescape.tls.enabled" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hubble-timescape-gen-certs
  namespace: {{ include "cilium.namespace" . }}
  {{- $annotations := mergeOverwrite (dict)
    .Values.hubble.annotations
    .Values.hubble.timescape.annotations
    .Values.hubble.timescape.tls.auto.roleBinding.annotations
  }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "hubble.timescape.labels" . | nindent 4 }}
    {{- with .Values.hubble.timescape.tls.auto.roleBinding.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hubble-timescape-gen-certs
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccounts.hubblecertgen.name | quote }}
  namespace: {{ include "cilium.namespace" . }}
{{- end }}
{{- end }}
