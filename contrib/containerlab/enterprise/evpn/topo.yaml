name: evpn-cluster
# use custom mgmt network to not overlap with kind network
mgmt:
  network: evpn_mgmt
  ipv4-subnet: 172.100.100.0/24
  ipv6-subnet: 3fff:172:100:100::/64
topology:
  nodes:
    tor:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      labels:
        router: frr
      env:
        EVPN_SOURCE_INTERFACE_FILTER: ${EVPN_SOURCE_INTERFACE_FILTER:-true}
      binds:
        - ./frr:/etc/frr
      exec:
        # set up VRFs
        - /etc/frr/vrf-setup.sh
        # set IPs on links to Cilium
        - ip addr add 169.254.0.1/29 dev net0
        - ip addr add 169.254.0.9/29 dev net1
        - ip addr add 169.254.0.17/29 dev net2
        # only accept VXLAN packets from the expected VTEP IPs to verify evpn.sourceInterface config works
        # (using tc as iptables / nftables is not available in the frr image)
        - |
          sh -ec '
            if [ "$$EVPN_SOURCE_INTERFACE_FILTER" = "true" ]; then
              tc qdisc add dev net0 clsact
              tc filter add dev net0 ingress protocol ip pref 1 flower ip_proto udp dst_port 4789 src_ip 100.64.1.11/32 action pass
              tc filter add dev net0 ingress protocol ip pref 2 flower ip_proto udp dst_port 4789 action drop
              tc qdisc add dev net1 clsact
              tc filter add dev net1 ingress protocol ip pref 1 flower ip_proto udp dst_port 4789 src_ip 100.64.1.12/32 action pass
              tc filter add dev net1 ingress protocol ip pref 2 flower ip_proto udp dst_port 4789 action drop
              tc qdisc add dev net2 clsact
              tc filter add dev net2 ingress protocol ip pref 1 flower ip_proto udp dst_port 4789 src_ip 100.64.1.13/32 action pass
              tc filter add dev net2 ingress protocol ip pref 2 flower ip_proto udp dst_port 4789 action drop
            fi
          '
    cilium1:
      kind: linux
      image: quay.io/cilium/alpine-curl:v1.10.0
      network-mode: container:evpn-cluster-control-plane
      entrypoint: sleep infinity
      exec:
      # VTEP IP
      - ip addr add 100.64.1.11/32 dev lo
      # IP on the link to tor
      - ip addr add 169.254.0.2/29 dev net0
    cilium2:
      kind: linux
      image: quay.io/cilium/alpine-curl:v1.10.0
      network-mode: container:evpn-cluster-worker
      entrypoint: sleep infinity
      exec:
      # VTEP IP
      - ip addr add 100.64.1.12/32 dev lo
      # IP on the link to tor
      - ip addr add 169.254.0.10/29 dev net0
    cilium3:
      kind: linux
      image: quay.io/cilium/alpine-curl:v1.10.0
      network-mode: container:evpn-cluster-worker2
      entrypoint: sleep infinity
      exec:
        # VTEP IP
        - ip addr add 100.64.1.13/32 dev lo
        # IP on the link to tor
        - ip addr add 169.254.0.18/29 dev net0
    vni100-host:
      kind: linux
      image: quay.io/cilium/alpine-curl:v1.10.0
      network-mode: none
      entrypoint: sleep infinity
      exec:
        # link + default route to ToR
        - ip addr add 192.168.1.100/24 dev net0
        - ip route add default via 192.168.1.1
        - ip addr add fd10:0:1::100/64 dev net0
        - ip -6 route add default via fd10:0:1::1
    vni200-host:
      kind: linux
      image: quay.io/cilium/alpine-curl:v1.10.0
      network-mode: none
      entrypoint: sleep infinity
      exec:
        # link + default route to ToR
        - ip addr add 192.168.2.100/24 dev net0
        - ip route add default via 192.168.2.1
        - ip addr add fd10:0:2::100/64 dev net0
        - ip -6 route add default via fd10:0:2::1
  links:
    - endpoints: ["tor:net0", "cilium1:net0"]
    - endpoints: ["tor:net1", "cilium2:net0"]
    - endpoints: ["tor:net2", "cilium3:net0"]
    - endpoints: ["tor:net3", "vni100-host:net0" ]
    - endpoints: ["tor:net4", "vni200-host:net0" ]
