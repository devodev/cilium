debug:
  enabled: true
  verbose: datapath

devices:
  - eth0
  - eth1

ipv4:
  enabled: true
ipv6:
  enabled: true

ipam:
  mode: kubernetes

routingMode: native
ipv4NativeRoutingCIDR: 10.244.0.0/16
ipv6NativeRoutingCIDR: fd00:10:244::/56
autoDirectNodeRoutes: true

bpf:
  masquerade: true
  monitorAggregation: none

kubeProxyReplacement: true
k8sServiceHost: auto
k8sServicePort: 6443

enterprise:
  featureGate:
    strict: false
  vrf:
    enabled: true
