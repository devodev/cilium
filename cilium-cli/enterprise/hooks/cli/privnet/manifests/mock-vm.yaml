apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Name }}"
  namespace: "{{ .TestNamespace }}"
  labels:
    app.kubernetes.io/part-of: cilium-cli-privnet
spec:
  replicas: 1
  selector:
    matchLabels:
      name: "{{ .Name }}"
  strategy:
    type: Recreate
  template:
    metadata:
      name: "{{ .Name }}"
      labels:
        name: "{{ .Name }}"
        kind: "{{ .Kind }}"
        kubevirt.io: virt-launcher
        vm.kubevirt.io/name: {{ .Name }}
      annotations:
        {{- if .NeedsAnnotation }}
        privnet.isovalent.com/network-attachment: |-
          {{ formatPrimaryNetworkAttachment .Interfaces | indent 10 }}
        {{- with ( formatSecondaryNetworkAttachments .Interfaces ) }}
        privnet.isovalent.com/secondary-network-attachments: |-
          {{ . | indent 10 }}
        {{- end }}
        {{- end }}
        {{- with ( formatMultusNetworks .Interfaces .Kind ) }}
        k8s.v1.cni.cncf.io/networks: |-
          {{ . | indent 10 }}
        {{- end }}
    spec:
  {{- if .Affinity.Type }}
      affinity:
  {{- if eq .Affinity.Type "same-node" }}
        podAffinity:
  {{- else }}
        podAntiAffinity:
  {{- end }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: name
                    operator: In
                    values:
                      - {{ .Affinity.Target }}
              topologyKey: kubernetes.io/hostname
  {{- end }}
      automountServiceAccountToken: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
        {{- range .Interfaces }}
        {{- if .DNSServer.IsValid }}
        - {{ .DNSServer }}
        {{- end }}
        {{- end }}
      containers:
      - name: compute
        command:
        - python3
        - /mnt/scripts/echoserver.py
        env:
        - name: CILIUM_PRIVNET_NETWORK
          value: {{ ( index .Interfaces 0 ).Network }}
        - name: CILIUM_PRIVNET_PORT
          value: "{{ .ServePort }}"
        image: "{{ .MockVMImage }}"
        ports:
        - name: http
          containerPort: {{ .ServePort }}
          protocol: TCP
        readinessProbe:
          {{- if .IPv6Only }}
          exec:
            command:
            - curl
            - --fail
            - --max-time
            - "1"
            - localhost:{{ .ServePort }}
          {{- else }}
          httpGet:
            port: http
          {{- end }}
          failureThreshold: 3
          periodSeconds: 1
          successThreshold: 1
          timeoutSeconds: 1
        volumeMounts:
        - name: echoserver
          mountPath: /mnt/scripts
          readOnly: true
      terminationGracePeriodSeconds: 0
      volumes:
      - name: echoserver
        configMap:
          name: {{ .ScriptConfigMap }}
