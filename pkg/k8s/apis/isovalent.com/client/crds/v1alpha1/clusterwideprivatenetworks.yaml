---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusterwideprivatenetworks.isovalent.com
spec:
  group: isovalent.com
  names:
    categories:
    - cilium
    - isovalent
    kind: ClusterwidePrivateNetwork
    listKind: ClusterwidePrivateNetworkList
    plural: clusterwideprivatenetworks
    shortNames:
    - icpn
    singular: clusterwideprivatenetwork
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.vni
      name: VNI
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterwidePrivateNetwork defines a private network to which
          workloads can be attached.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: The private network specification.
            properties:
              networkAttachmentDefinitions:
                description: |-
                  Configures the Multus Network Attachment Definitions integration for
                  this private network.
                properties:
                  namespaceSelector:
                    description: |-
                      Selects the namespaces in which to automatically create a Multus Network
                      Attachment Definition (NAD) instance for each subnet associated with this
                      private network. By default, no namespace is selected, and no NAD is
                      automatically created for this private network.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              enum:
                              - In
                              - NotIn
                              - Exists
                              - DoesNotExist
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          description: MatchLabelsValue represents the value from
                            the MatchLabels {key,value} pair.
                          maxLength: 63
                          pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              networkBridges:
                description: |-
                  The list of Isovalent Network Bridges (INBs) serving this private network.
                  This stanza shall be specified in the main workload cluster(s) only, and
                  not in the INB clusters.
                items:
                  properties:
                    cluster:
                      description: The name of the cluster hosting the INB nodes.
                      maxLength: 32
                      minLength: 1
                      pattern: ^([a-z0-9][-a-z0-9]*)?[a-z0-9]$
                      type: string
                    nodeSelector:
                      description: |-
                        A selector to optionally select a subset of nodes in the target
                        cluster to be elected as INBs for this private network. Defaults to
                        selecting all nodes if unspecified.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                enum:
                                - In
                                - NotIn
                                - Exists
                                - DoesNotExist
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            description: MatchLabelsValue represents the value from
                              the MatchLabels {key,value} pair.
                            maxLength: 63
                            pattern: ^(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])?$
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                  required:
                  - cluster
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - cluster
                x-kubernetes-list-type: map
              subnets:
                description: |-
                  The set of subnets (that is, L2 domains) associated with, and directly
                  reachable, from this private network.
                items:
                  properties:
                    cidrv4:
                      description: The IPv4 CIDRv4 associated with the private network.
                      format: cidr
                      maxLength: 18
                      type: string
                      x-kubernetes-validations:
                      - message: Not an IPv4 CIDR
                        rule: cidr(self).ip().family() == 4
                      - message: Subnet IPv4 CIDR is immutable
                        rule: oldSelf == self
                    cidrv6:
                      description: The IPv6 CIDR associated with the private network.
                      format: cidr
                      maxLength: 42
                      type: string
                      x-kubernetes-validations:
                      - message: Not an IPv6 CIDR
                        rule: cidr(self).ip().family() == 6
                      - message: Subnet IPv6 CIDR is immutable
                        rule: oldSelf == self
                    dhcp:
                      default:
                        mode: none
                      description: DHCP defines DHCP relay configuration for this
                        subnet.
                      properties:
                        mode:
                          default: none
                          description: Mode selects how DHCP requests are relayed
                            for this subnet.
                          enum:
                          - broadcast
                          - relay
                          - none
                          type: string
                        relay:
                          description: Relay specifies the relay agent options when
                            mode=relay.
                          properties:
                            option82:
                              description: Option82 configures relay-agent option
                                82 suboptions.
                              properties:
                                circuitID:
                                  description: CircuitID is option 82 circuit-id value.
                                  maxLength: 255
                                  type: string
                                remoteID:
                                  description: RemoteID is option 82 remote-id value.
                                  maxLength: 255
                                  type: string
                              type: object
                            serverAddress:
                              description: ServerAddress is the DHCP server IP or
                                hostname for relay mode.
                              maxLength: 255
                              minLength: 1
                              type: string
                            serverPort:
                              default: 67
                              description: |-
                                ServerPort is the DHCP server port for relay mode.
                                Defaults to 67 when unset.
                              maximum: 65535
                              minimum: 1
                              type: integer
                          required:
                          - serverAddress
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: dhcp.relay can only be configured when mode is 'relay'
                        rule: self.mode == 'relay' || !has(self.relay)
                      - message: dhcp.relay must be configured when mode is 'relay'
                        rule: self.mode != 'relay' || has(self.relay)
                    name:
                      description: The name of the subnet.
                      maxLength: 63
                      minLength: 1
                      pattern: ^([a-z0-9][-a-z0-9]*)?[a-z0-9]$
                      type: string
                    routes:
                      description: The set of routes configured for this subnet.
                      items:
                        description: PrivateNetworkRouteSpec defines a route in the
                          private network.
                        properties:
                          destination:
                            description: The destination network.
                            format: cidr
                            type: string
                          gateway:
                            description: Gateway is the route's nexthop.
                            maxLength: 45
                            type: string
                            x-kubernetes-validations:
                            - message: must be a valid IP or 'EVPN'
                              rule: self == 'EVPN' || isIP(self)
                        required:
                        - destination
                        - gateway
                        type: object
                      maxItems: 64
                      type: array
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: Either cidrv4 or cidrv6 needs to be provided
                    rule: has(self.cidrv4) || has(self.cidrv6)
                maxItems: 256
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              vni:
                description: |-
                  A 24bit numeric identifier of this private network. Specify this
                  field when you wish to integrate this private network with
                  EVPN/VXLAN. In that case, the value will be reflected to the BGP
                  advertisement and dataplane handling of ingress traffic over VXLAN.
                format: int32
                maximum: 16777215
                type: integer
            required:
            - subnets
            type: object
          status:
            description: The private network status.
            properties:
              conditions:
                description: The current conditions of the PrivateNetwork
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              vni:
                description: An allocated VNI value
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
