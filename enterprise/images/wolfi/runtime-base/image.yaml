contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - gops=0.3.29-r12
    - grep=3.12-r6 #Needed by the mount-bpf-fs init container
    - jq=1.8.2-r0 #Needed for cilium connectivity test to work
    - mount=2.42.2-r0 #Needed by the mount-bpf-fs init container
    - util-linux-misc=2.42.2-r0 #nsenter, used by the init script that calls cilium-tools-mount, but not that package itself
    - bash=5.3-r12
    - busybox=1.37.0-r61
    - ca-certificates=20251003-r4
    - iproute2=7.1.0-r0
    - ipset=7.24-r5
    - kmod=34.2-r46
    - shadow=4.19.4-r2 # Needed for groupadd
    - curl=8.21.0-r1  # temporary, for getting prometheus metrics in CI
    - gcc-14=14.4.0-r0 # for some header files
    - libatomic=16.1.0-r4 # Needed for embedded envoy
    - openssl=3.6.3-r3
    - cni-plugins-loopback=1.9.1-r8
    - make=4.4.1-r13
    - libmnl-dev=1.0.5-r8
    - libnftnl-dev=1.3.1-r3
    - pkgconf=3.0.4-r0
archs:
  - x86_64
  - arm64
