apiVersion: cilium.io/v2
kind: CiliumEnvoyConfig
metadata:
  annotations:
    cec.cilium.io/inject-cilium-filters: "false"
    cec.cilium.io/is-l7lb: "false"
    cec.cilium.io/use-original-source-address: "false"
  name: lbfe-lb-1
  namespace: default
spec:
  nodeSelector:
    matchExpressions:
    - key: service.cilium.io/node
      operator: In
      values:
      - t1-t2
      - t2
  resources:
  - '@type': type.googleapis.com/envoy.config.listener.v3.Listener
    address:
      socketAddress:
        address: 100.64.0.100
        portValue: 80
    filterChains:
    - filterChainMatch:
        directSourcePrefixRanges:
        - addressPrefix: 172.18.0.0
          prefixLen: 32
        - addressPrefix: 172.18.0.1
          prefixLen: 32
        transportProtocol: raw_buffer
      filters:
      - name: envoy.filters.network.http_connection_manager
        typedConfig:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          commonHttpProtocolOptions:
            headersWithUnderscoresAction: REJECT_REQUEST
            maxConnectionDuration: 3600s
          generateRequestId: true
          http2ProtocolOptions:
            initialConnectionWindowSize: 1048576
            initialStreamWindowSize: 65535
            maxConcurrentStreams: 100
          httpFilters:
          - name: envoy.filters.http.health_check
            typedConfig:
              '@type': type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
              clusterMinHealthyPercentages:
                backend_cluster_lb-1:
                  value: 20
              headers:
              - name: :path
                stringMatch:
                  exact: /health
              - name: :method
                stringMatch:
                  exact: GET
              - name: user-agent
                stringMatch:
                  prefix: cilium-probe/
              passThroughMode: false
          - name: envoy.filters.http.router
            typedConfig:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              suppressEnvoyHeaders: true
          mergeSlashes: true
          normalizePath: true
          routeConfig: {}
          serverName: ilb
          statPrefix: healthcheck_http_default_lb-1
          stripMatchingHostPort: true
          useRemoteAddress: false
    - filterChainMatch:
        transportProtocol: raw_buffer
      filters:
      - name: envoy.filters.network.tcp_proxy
        typedConfig:
          '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          accessLog:
          - name: stdout
            typedConfig:
              '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              logFormat:
                textFormatSource:
                  inlineString: |2+

          cluster: backend_cluster_lb-1
          statPrefix: tcp_proxy_default_lb-1_0
    listenerFilters:
    - name: cilium.bpf_metadata
      typedConfig:
        '@type': type.googleapis.com/cilium.BpfMetadata
    name: frontend_listener_tcp
    perConnectionBufferLimitBytes: 32768
    statPrefix: default_lb-1
    trafficDirection: INBOUND
