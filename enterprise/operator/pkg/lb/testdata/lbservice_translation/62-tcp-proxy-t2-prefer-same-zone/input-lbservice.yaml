apiVersion: isovalent.com/v1alpha1
kind: LBService
metadata:
  namespace: default
  name: lb-1
spec:
  vipRef:
    name: lb-1
  port: 80
  trafficPolicy:
    zoneAware:
      mode: preferSameZone
      minBackendCount: 7
  applications:
    tcpProxy:
      forceDeploymentMode: t1-t2
      routes:
        - backendRef:
            name: lb-1
