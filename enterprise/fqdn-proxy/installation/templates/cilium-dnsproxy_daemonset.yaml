---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    k8s-app: cilium-dnsproxy
    app.kubernetes.io/part-of: cilium
    app.kubernetes.io/name: cilium-dnsproxy
  name: cilium-dnsproxy
  namespace: {{ .Release.Namespace }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      k8s-app: cilium-dnsproxy
{{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | trim | nindent 4 }}
{{- end }}
  template:
    metadata:
      annotations:
{{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
{{- end }}
      labels:
        k8s-app: cilium-dnsproxy
        app.kubernetes.io/name: cilium-dnsproxy
        app.kubernetes.io/part-of: cilium
{{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
{{- end }}
    spec:
{{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 6 }}
{{- end }}
      containers:
      - command:
        - dnsproxy
        args:
{{- if .Values.debug }}
        - --debug
{{- end }}
{{- if .Values.pprof.enabled }}
        - --pprof=true
  {{- if .Values.pprof.address }}
        - --pprof-address={{.Values.pprof.address }}
  {{- end }}
  {{- if .Values.pprof.port }}
        - --pprof-port={{.Values.pprof.port }}
  {{- end }}
  {{- if .Values.pprof.mutexProfileFraction }}
        - --pprof-mutex-profile-fraction={{ .Values.pprof.mutexProfileFraction }}
  {{- end }}
  {{- if .Values.pprof.blockProfileRate }}
        - --pprof-block-profile-rate={{ .Values.pprof.blockProfileRate }}
  {{- end }}
{{- end }}
{{- if .Values.metrics.enabled }}
        - --expose-metrics
{{- end }}
{{- if .Values.metrics.port }}
        - --prometheus-port={{ .Values.metrics.port }}
{{- end }}
{{- if .Values.offlineMode.enabled }}
        - --tofqdns-enable-offline-mode=true
{{- end }}
{{- with .Values.extraArgs }}
{{- toYaml . | trim | nindent 8 }}
{{- end }}
        {{- if .Values.startupProbe.enabled }}
        startupProbe:
          exec:
            command:
            - dnsproxy
            - shell
            - --
            - db/initialized
            - health
            - --timeout
            - 3s
          periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          successThreshold: 1
          failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          timeoutSeconds: 5
        {{- end }}
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          exec:
            command:
            - dnsproxy
            - shell
            - --
            - health
            - --match
            - fqdnha-proxy.job-fqdnha-proxy
            - --levels
            - ok
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          successThreshold: 1
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          timeoutSeconds: 5
        {{- end }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          exec:
            command:
            - dnsproxy
            - shell
            - --
            - health
            - --match
            - fqdnha-proxy.job-fqdnha-proxy
            - --levels
            - ok
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          successThreshold: 1
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          timeoutSeconds: 5
        {{- end }}
        env:
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: CILIUM_K8S_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: CILIUM_DEBUG
          valueFrom:
            configMapKeyRef:
              key: debug
              name: cilium-config
              optional: true
        - name: CILIUM_LOG_DRIVER
          valueFrom:
            configMapKeyRef:
              key: log-driver
              name: cilium-config
              optional: true
        - name: CILIUM_LOG_OPT
          valueFrom:
            configMapKeyRef:
              key: log-opt
              name: cilium-config
              optional: true
        - name: CILIUM_ENABLE_IPV4
          valueFrom:
            configMapKeyRef:
              key: enable-ipv4
              name: cilium-config
              optional: true
        - name: CILIUM_ENABLE_IPV6
          valueFrom:
            configMapKeyRef:
              key: enable-ipv6
              name: cilium-config
              optional: true
        - name: CILIUM_TOFQDNS_ENABLE_DNS_COMPRESSION
          valueFrom:
            configMapKeyRef:
              key: tofqdns-enable-dns-compression
              name: cilium-config
              optional: true
        - name: CILIUM_FQDN_REGEX_COMPILE_LRU_SIZE
          valueFrom:
            configMapKeyRef:
              key: fqdn-regex-compile-lru-size
              name: cilium-config
              optional: true
        - name: CILIUM_TOFQDNS_DNS_REJECT_RESPONSE_CODE
          valueFrom:
            configMapKeyRef:
              key: tofqdns-dns-reject-response-code
              name: cilium-config
              optional: true
        - name: CILIUM_DNSPROXY_ENABLE_TRANSPARENT_MODE
          valueFrom:
            configMapKeyRef:
              key: dnsproxy-enable-transparent-mode
              name: cilium-config
              optional: true
        - name: CILIUM_DNSPROXY_SOCKET_LINGER_TIMEOUT
          valueFrom:
            configMapKeyRef:
              key: dnsproxy-socket-linger-timeout
              name: cilium-config
              optional: true
{{- with .Values.extraEnv }}
{{ toYaml . | trim | indent 8 }}
{{- end }}
        image: "{{ if .Values.image.override }}{{ .Values.image.override }}{{ else }}{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ end }}"
        imagePullPolicy: {{ .Values.image.imagePullPolicy }}
        terminationMessagePolicy: FallbackToLogsOnError
{{- if .Values.metrics.enabled }}
        ports:
        - containerPort: {{ .Values.metrics.port }}
          name: metrics
          protocol: TCP
{{- end }}
{{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | trim | nindent 10 }}
{{- end }}
        name: cilium-dnsproxy
        securityContext:
          {{- include "dnsproxy.securityContext" . | nindent 10 }}
        volumeMounts:
        - mountPath: /var/run/cilium
          name: cilium-run
        - mountPath: /tmp/cilium/config-map
          name: cilium-config-path
          readOnly: true
{{- if .Values.offlineMode.enabled}}
        - mountPath: /sys/fs/bpf
          name: bpf-maps
          mountPropagation: HostToContainer
{{- end }}
{{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
{{- end }}
      hostNetwork: true
      restartPolicy: Always
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: 1
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- with .Values.tolerations }}
      tolerations:
      {{- toYaml . | trim | nindent 6 }}
{{- end }}
{{- if .Values.dnsPolicy }}
      dnsPolicy: {{ .Values.dnsPolicy }}
{{- end }}
      volumes:
        # To keep state between restarts / upgrades
      - hostPath:
          path: {{ .Values.runPath }}
          type: DirectoryOrCreate
        name: cilium-run
        # To be able to load kernel modules
      - hostPath:
          path: /lib/modules
        name: lib-modules
        # To access iptables concurrently with other processes (e.g. kube-proxy)
      - hostPath:
          path: /run/xtables.lock
          type: FileOrCreate
        name: xtables-lock
{{- if .Values.offlineMode.enabled}}
      - hostPath:
          path: /sys/fs/bpf
          type: DirectoryOrCreate
        name: bpf-maps
{{- end }}
      - configMap:
          name: cilium-config
        name: cilium-config-path
{{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
{{- end }}
