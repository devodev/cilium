syntax = "proto3";

import "google/protobuf/timestamp.proto";

package t2servicehealth.v1;

option go_package = "github.com/cilium/cilium/enterprise/pkg/lb/t2servicehealth/api/v1";

service ServiceHealth {
  rpc Watch(WatchRequest) returns (stream WatchResponse){};
}

message WatchRequest {}

message WatchResponse {
  // FullSnapshot indicates that the events field contains the full current
  // table contents. Subsequent messages contain incremental updates.
  bool full_snapshot = 1;
  repeated Event events = 2;

  message Event {
    string namespace = 1;
    string name = 2;
    bool healthy = 3;
    int32 healthy_backends = 4;
    int32 total_backends = 5;
    uint32 min_healthy_pct = 6;
    google.protobuf.Timestamp updated_at = 7;
    google.protobuf.Timestamp expires_at = 8;
    bool deleted = 9;
  }
}
