---
swagger: '2.0'
info:
  title: Cilium Enterprise API
  description: Cilium Enterprise
  version: v1alpha1
x-schemes:
- unix
basePath: "/v1enterprise"
produces:
- application/json
consumes:
- application/json
paths:
  "/healthz":
    get:
      summary: Retrieve Cilium Enterprise health
      responses:
        '200':
          description: Success
        '500':
          description: Internal server error
          x-go-name: Failure
          schema:
            "$ref": "#/definitions/Error"
        '404':
          description: Cilium Enterprise API is not available
          x-go-name: Disabled
  "/network/private/addressing":
    get:
      summary: Retrieve the private network for the pod
      tags:
        - network
      parameters:
        - "$ref": "#/parameters/network-name"
        - "$ref": "#/parameters/network-subnet"
        - "$ref": "#/parameters/network-pod-name"
        - "$ref": "#/parameters/network-pod-namespace"
        - "$ref": "#/parameters/network-pod-uid"
        - "$ref": "#/parameters/network-ifname"
      responses:
        '200':
          description: Success
          schema:
            "$ref": "#/definitions/PrivateNetworkAddressingResponse"
        '500':
          description: Network attachment error
          x-go-name: Failure
          schema:
            "$ref": "#/definitions/Error"
        '501':
          description: Private network feature is disabled
          x-go-name: Disabled
  "/config":
    get:
      summary: Get configuration of enterprise-only features of Cilium daemon
      tags:
        - daemon
      responses:
        '200':
          description: Success
          schema:
            "$ref": "#/definitions/EnterpriseDaemonConfiguration"
parameters:
  network-name:
    name: network
    description: Name of the target private network, if provided via CNI configuration
    required: false
    in: query
    type: string
  network-subnet:
    name: subnet
    description: Name of the target subnet in the private network, if provided via CNI configuration
    required: false
    in: query
    type: string
  network-pod-name:
    name: pod-name
    description: Kubernetes pod name for which to query the network attachment
    required: true
    in: query
    type: string
  network-pod-namespace:
    name: pod-namespace
    description: Kubernetes pod namespace for which to query the network attachment
    required: true
    in: query
    type: string
  network-pod-uid:
    name: pod-uid
    description: Kubernetes pod uid for which to query the network attachment
    required: true
    in: query
    type: string
  network-ifname:
    name: ifname
    description: Interface name, used to identify the network attachment in case of multi-NIC pods
    required: true
    in: query
    type: string

definitions:
  Error:
    type: string
  NetworkAttachmentRoute:
    description: Route for a network attachment
    type: object
    properties:
      destination:
        description: Route destination
        type: string
      gateway:
        description: Route gateway
        type: string
  PrivateNetworksConfiguration:
    description: Private networks configuration
    type: object
    properties:
      enabled:
        description: Indicates whether support for private networks is enabled
        type: boolean
      mode:
        description: Private networks mode
        type: string
  PrivateNetworkAddressingResponse:
    description: |-
      Contains the endpoint's private network specific information
    properties:
      addressing:
        description: >
          Optional network addressing information. Empty if the endpoint is not
          attached to a specific private network.
        "$ref": "#/definitions/PrivateNetworkAddressing"
  PrivateNetworkAddressing:
    description: Description of a private network
    type: object
    properties:
      network:
        description: Private network name
        type: string
      subnet:
        description: Private network subnet
        type: string
      address:
        "$ref": "#/definitions/AddressPair"
      mac:
        description: MAC address of the endpoint within the private network
        type: string
      activatedAt:
        description: Time timestamp when the pod was activated
        type: string
        format: date-time
      routes:
        description: Network routes to configure for this endpoint
        type: array
        items:
          "$ref": "#/definitions/NetworkAttachmentRoute"
      nicIndex:
        description: >
          The index of the NIC this endpoint refers to; it is 0 for the primary
          interface, 1 for the first secondary interface, and so on.
        type: integer
        minimum: 0
        maximum: 64

  AddressPair:
    description: Addressing information of an endpoint
    type: object
    properties:
      ipv4:
        description: IPv4 address
        type: string
      ipv6:
        description: IPv6 address
        type: string
  EnterpriseDaemonConfiguration:
    description: The current configuration of any enterprise-only features
    type: object
    properties:
      private-networks:
        description: Private networks configuration
        "$ref": "#/definitions/PrivateNetworksConfiguration"
