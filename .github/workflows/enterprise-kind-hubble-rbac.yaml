name: Hubble RBAC E2E test

# Any change in triggers needs to be reflected in the concurrency group.
on:
  workflow_dispatch:
    inputs:
      PR-number:
        description: "Pull request number."
        required: true
      context-ref:
        description: "Context in which the workflow runs. If PR is from a fork, will be the PR target branch (general case). If PR is NOT from a fork, will be the PR branch itself (this allows committers to test changes to workflows directly from PRs)."
        required: true
      SHA:
        description: "SHA under test (head of the PR branch)."
        required: true
      base-SHA:
        description: "SHA of the base branch (target branch of the PR)."
        required: false
      extra-args:
        description: "[JSON object] Arbitrary arguments passed from the trigger comment via regex capture group. Parse with 'fromJson(inputs.extra-args).argName' in workflow."
        required: false
        default: '{}'

permissions:
  actions: read
  # To be able to access the repository with actions/checkout
  contents: read
  # To be able to request the JWT from GitHub's OIDC provider
  id-token: write
  # To allow retrieving information from the PR API
  pull-requests: read
  # To be able to set commit status
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.after }}
  cancel-in-progress: true

env:
  helm_chart_repo: oci://quay.io/isovalent-charts-dev/cilium
  kind_config: ".github/kind-config-enterprise-hubble-rbac.yaml"

  # renovate: datasource=helm depName=dex registryUrl=https://charts.dexidp.io
  DEX_VERSION: 0.24.0
  # renovate: datasource=helm depName=ingress-nginx registryUrl=https://kubernetes.github.io/ingress-nginx
  INGRESS_NGINX_VERSION: 4.15.1


jobs:
  echo-inputs:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Echo Workflow Dispatch Inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Echo Workflow Dispatch Inputs
        run: |
          echo '${{ tojson(inputs) }}'

  commit-status-start:
    name: Commit Status Start
    runs-on: ubuntu-24.04
    steps:
      - name: Set initial commit status
        uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # v2.0.1
        with:
          sha: ${{ github.event.pull_request.head.sha || github.sha }}

  test-hubble-rbac:
    name: Hubble RBAC E2E test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Collect Workflow Telemetry
        uses: catchpoint/workflow-telemetry-action@94c3c3d9567a0205de6da68a76c428ce4e769af1 # v2.0.0
        with:
          comment_on_pr: false

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # checkout pull request head ref so that print-chart-version.sh prints the correct chart version.
          ref: ${{ github.event.pull_request.head.ref }}
          # required for git describe
          fetch-depth: 0

      - name: Set Environment Variables
        uses: ./.github/actions/set-env-variables

      - name: Set up job variables
        id: vars
        run: |
          version=$(bash contrib/scripts/print-chart-version.sh)
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo ${version}

          SHA="${{ github.event.pull_request.head.sha }}"

          echo sha=${SHA} >> $GITHUB_OUTPUT

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_K8S_IMAGE }}
          kubectl_version: ${{ env.KIND_K8S_VERSION }}
          config: ${{ env.kind_config }}
          cluster_name: hubble-rbac
          wait: 0 # The control-plane never becomes ready, since no CNI is present

      - name: Install Cilium CLI
        uses: cilium/cilium-cli@3ce83aa3b4ea3ce6d97023c4d83c22b73a4ed3b4 # v0.19.2
        with:
          skip-build: ${{ env.CILIUM_CLI_SKIP_BUILD }}
          image-repo: ${{ env.CILIUM_CLI_IMAGE_REPO }}
          image-tag: ${{ steps.vars.outputs.sha }}
          repository: ${{ env.CILIUM_CLI_RELEASE_REPO }}
          release-version: ${{ env.CILIUM_CLI_VERSION }}

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: 1.26.1

      - name: Wait for Helm dev chart to be available
        timeout-minutes: 30
        shell: bash
        run: |
          echo ${{ secrets.QUAY_CHARTS_DEV_PASSWORD }} | helm registry login quay.io -u ${{ secrets.QUAY_CHARTS_DEV_USERNAME }} --password-stdin
          until helm pull ${{ env.helm_chart_repo }} --version ${{ steps.vars.outputs.version }}; do sleep 30s; done

      - name: Setup
        timeout-minutes: 10
        run: |
          ./enterprise/test/hubble-rbac/setup.sh
        shell: bash
        env:
          CILIUM_VERSION: ${{ steps.vars.outputs.version }}
          CILIUM_CHART_REPO: ${{ env.helm_chart_repo }}
          KIND_CTRLPLANE_NAME: hubble-rbac-control-plane

      - name: Port forward Relay
        run: |
          cilium hubble port-forward&
          sleep 10s
          nc -nvz 127.0.0.1 4245

      - name: Run tests - Hubble Relay
        run: |
          go test -tags enterprise_hubble_rbac_e2e ./enterprise/test/hubble-rbac --count 1
        shell: bash
        env:
          HUBBLE_TLS: "true"
          HUBBLE_TLS_ALLOW_INSECURE: "true"
          HUBBLE_ISSUER: "http://dex.test"
          HUBBLE_CLIENT_ID: "test-client-id"
          HUBBLE_CLIENT_SECRET: "test-client-secret"
          ADMIN_OIDC_USER: "admin@example.com"
          ADMIN_OIDC_PASSWORD: "password"
          DEMO_OIDC_USER: "demo@example.com"
          DEMO_OIDC_PASSWORD: "demo"

      - name: Port forward Timescape
        run: |
          kubectl -n kube-system port-forward svc/hubble-timescape 4246:443 &
          sleep 10s
          nc -nvz 127.0.0.1 4246

      - name: Run tests - Hubble Timescape
        run: |
          go test -tags enterprise_hubble_rbac_e2e ./enterprise/test/hubble-rbac --count 1
        shell: bash
        env:
          HUBBLE_SERVER: localhost:4246
          HUBBLE_TLS: "true"
          HUBBLE_TLS_ALLOW_INSECURE: "true"
          HUBBLE_ISSUER: "http://dex.test"
          HUBBLE_CLIENT_ID: "test-client-id"
          HUBBLE_CLIENT_SECRET: "test-client-secret"
          ADMIN_OIDC_USER: "admin@example.com"
          ADMIN_OIDC_PASSWORD: "password"
          DEMO_OIDC_USER: "demo@example.com"
          DEMO_OIDC_PASSWORD: "demo"

      - name: Cleanup
        if: ${{ always() }}
        run: |
          echo "===Dex Logs==="
          kubectl -n dex logs deployments/dex
          echo ""
          echo "===Nginx Logs==="
          kubectl -n ingress-nginx logs deployments/ingress-nginx-controller
        shell: bash {0} # Disable default fail-fast behaviour so that all commands run independently

      - name: Run common post steps
        if: ${{ always() }}
        uses: ./.github/actions/post-logic
        with:
          artifacts_suffix: "enterprise-kind-hubble-rbac"
          job_status: "${{ job.status }}"

  merge-upload-and-status:
    name: Merge Upload and Status
    if: ${{ always() }}
    needs: test-hubble-rbac
    uses: ./.github/workflows/common-post-jobs.yaml
    secrets: inherit
    with:
      context-ref: ${{ inputs.context-ref || github.sha }}
      sha: ${{ github.event.pull_request.head.sha || github.sha }}
      success: ${{ needs.test-hubble-rbac.result == 'success' }}
