name: Enterprise Image CI Build

# Any change in triggers needs to be reflected in the concurrency group
on:
  workflow_dispatch:
    inputs:
      PR-number:
        description: "Pull request number."
        required: true
      context-ref:
        description: "Context in which the workflow runs. If PR is from a fork, will be the PR target branch (general case). If PR is NOT from a fork, will be the PR branch itself (this allows committers to test changes to workflows directly from PRs)."
        required: true
      SHA:
        description: "SHA under test (head of the PR branch)."
        required: true
      base-SHA:
        description: "SHA of the base branch (target branch of the PR)."
        required: false
      extra-args:
        description: "[JSON object] Arbitrary arguments passed from the trigger comment via regex capture group. Parse with 'fromJson(inputs.extra-args).argName' in workflow."
        required: false
        default: "{}"

  push:
    branches:
      - main-ce
      - ft/main-ce/**
  merge_group:
    types: [checks_requested]

  # If the cache was cleaned we should re-build the cache with the latest commit
  workflow_run:
    workflows:
      - "Image CI Cache Cleaner"
    branches:
      - main-ce
      - ft/main-ce/**
    types:
      - completed

permissions:
  # To be able to access the repository with `actions/checkout`
  contents: read
  statuses: write
  actions: read
  # to get PR author
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.PR-number || github.event.after }}
  cancel-in-progress: true

jobs:
  echo-inputs:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Echo Workflow Dispatch Inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Echo Workflow Dispatch Inputs
        run: |
          echo '${{ tojson(inputs) }}'

  commit-status-start:
    name: Commit Status Start
    runs-on: ubuntu-24.04
    steps:
      - name: Set initial commit status
        uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # v2.0.1
        with:
          sha: ${{ inputs.SHA || github.sha }}

  load-versions:
    name: Load UBI base image versions
    runs-on: ubuntu-24.04
    outputs:
      ubi-minimal: ${{ steps.load.outputs.ubi-minimal }}
      ubi-micro: ${{ steps.load.outputs.ubi-micro }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Load UBI versions
        id: load
        uses: ./.github/actions/load-ubi-versions

  envoy-version:
    name: Retrieve the envoy version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.envoy_version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Get version
        id: version
        env:
          # renovate: datasource=docker depName=mikefarah/yq
          yq_version: 4.53.3
        run: |
          repo_dir=$(git rev-parse --show-toplevel)
          envoy_version=$(docker run --rm -v "${repo_dir}/install/kubernetes/cilium/values.yaml":/workdir/values.yaml --user "$(id -u):$(id -g)" mikefarah/yq:${yq_version} e ".envoy.image.tag" /workdir/values.yaml)
          echo "envoy_version=${envoy_version}" >> $GITHUB_OUTPUT

  build-and-push-prs:
    timeout-minutes: 45
    name: Build and Push Images
    needs: [load-versions, envoy-version]
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST || 'ubuntu-24.04' }}
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    strategy:
      matrix:
        include:
          - name: cilium
            distro: ubi
            dockerfile: ./enterprise/images/cilium/Dockerfile
            image_name: cilium-ubi
            build_args: |
              PUSH=true
              # renovate: datasource=docker
              RUNTIME_IMAGE=${{ vars.ARTIFACTORY_HOST }}/${{ vars.ARTIFACTORY_ORGANIZATION_DEV }}/cilium-runtime-ubi:6c675c2927481d0ebc409d44ee42d1cca416a611
              # renovate: datasource=docker
              UBI_IMAGE=${{ vars.ARTIFACTORY_HOST }}/${{ vars.ARTIFACTORY_ORGANIZATION_DEV }}/cilium-runtime-ubi:6c675c2927481d0ebc409d44ee42d1cca416a611
              CILIUM_ENVOY_IMAGE=quay.io/isovalent-dev/cilium-envoy-ubi:${{ needs.envoy-version.outputs.version }}
              OPERATOR_VARIANT=cilium-ubi

          - name: operator
            distro: ubi
            dockerfile: ./enterprise/images/operator/Dockerfile
            image_name: operator-generic-ubi
            build_args: |
              PUSH=true
              RUNTIME_IMAGE=${{ needs.load-versions.outputs.ubi-micro }}
              UBI_IMAGE=${{ needs.load-versions.outputs.ubi-micro }}
              OPERATOR_VARIANT=operator-generic-ubi

          - name: hubble-relay
            distro: ubi
            dockerfile: ./enterprise/images/hubble-relay/Dockerfile
            image_name: hubble-relay-ubi
            build_args: |
              PUSH=true
              RUNTIME_IMAGE=${{ needs.load-versions.outputs.ubi-micro }}
              UBI_IMAGE=${{ needs.load-versions.outputs.ubi-micro }}
              OPERATOR_VARIANT=hubble-relay-ubi

          - name: clustermesh-apiserver
            distro: ubi
            dockerfile: ./enterprise/images/clustermesh-apiserver/Dockerfile
            image_name: clustermesh-apiserver-ubi
            build_args: |
              PUSH=true
              RUNTIME_IMAGE=${{ needs.load-versions.outputs.ubi-micro }}
              UBI_IMAGE=${{ needs.load-versions.outputs.ubi-micro }}
              OPERATOR_VARIANT=clustermesh-apiserver-ubi

          - name: gateway-api-controlplane
            distro: ubi
            dockerfile: ./enterprise/images/gateway-api-controlplane/Dockerfile
            image_name: gateway-api-controlplane-ubi
            build_args: |
              PUSH=true
              IMAGE_NAME=gateway-api-controlplane-ubi
              BASE_IMAGE=${{ needs.load-versions.outputs.ubi-micro }}
              RUNTIME_IMAGE=${{ needs.load-versions.outputs.ubi-micro }}

          - name: gateway-api-controlplane
            distro: chainguard
            dockerfile: ./enterprise/images/gateway-api-controlplane/Dockerfile
            image_name: gateway-api-controlplane
            platforms: linux/amd64,linux/arm64
            build_args: |
              BASE_IMAGE=quay.io/isovalent-dev/cilium-runtime-wfi:a23cb179a0f1ca69f3e0a03d46f4748fbf02d204@sha256:ad3ab1a22177673568e44cbbcb4a09ea521fff7c9dd39ee1b6a4386846fe5acd

          - name: cilium
            distro: chainguard
            dockerfile: ./images/cilium/Dockerfile
            image_name: cilium
            platforms: linux/amd64,linux/arm64
            build_args: |
              CILIUM_RUNTIME_IMAGE=quay.io/isovalent-dev/cilium-runtime-wfi:a23cb179a0f1ca69f3e0a03d46f4748fbf02d204@sha256:ad3ab1a22177673568e44cbbcb4a09ea521fff7c9dd39ee1b6a4386846fe5acd

          - name: cilium-cli
            distro: distroless
            dockerfile: ./cilium-cli/Dockerfile
            image_name: cilium-cli
            platforms: linux/amd64
            require-dir: cilium-cli
            build_args: |
              CILIUM_RUNTIME_IMAGE=quay.io/isovalent-dev/cilium-runtime-wfi:a23cb179a0f1ca69f3e0a03d46f4748fbf02d204@sha256:ad3ab1a22177673568e44cbbcb4a09ea521fff7c9dd39ee1b6a4386846fe5acd

          - name: operator-aws
            distro: scratch
            dockerfile: ./images/operator/Dockerfile
            image_name: operator-aws
            platforms: linux/amd64,linux/arm64
            build_args: |
              CILIUM_RUNTIME_IMAGE=quay.io/isovalent-dev/cilium-runtime-wfi:a23cb179a0f1ca69f3e0a03d46f4748fbf02d204@sha256:ad3ab1a22177673568e44cbbcb4a09ea521fff7c9dd39ee1b6a4386846fe5acd
              OPERATOR_VARIANT=operator-aws

          - name: operator-azure
            distro: scratch
            dockerfile: ./images/operator/Dockerfile
            image_name: operator-azure
            platforms: linux/amd64,linux/arm64
            build_args: |
              CILIUM_RUNTIME_IMAGE=quay.io/isovalent-dev/cilium-runtime-wfi:a23cb179a0f1ca69f3e0a03d46f4748fbf02d204@sha256:ad3ab1a22177673568e44cbbcb4a09ea521fff7c9dd39ee1b6a4386846fe5acd
              OPERATOR_VARIANT=operator-azure

          - name: operator-alibabacloud
            distro: scratch
            dockerfile: ./images/operator/Dockerfile
            image_name: operator-alibabacloud
            platforms: linux/amd64,linux/arm64
            build_args: |
              CILIUM_RUNTIME_IMAGE=quay.io/isovalent-dev/cilium-runtime-wfi:a23cb179a0f1ca69f3e0a03d46f4748fbf02d204@sha256:ad3ab1a22177673568e44cbbcb4a09ea521fff7c9dd39ee1b6a4386846fe5acd
              OPERATOR_VARIANT=operator-alibabacloud

          - name: operator-generic
            distro: scratch
            dockerfile: ./images/operator/Dockerfile
            image_name: operator-generic
            platforms: linux/amd64,linux/arm64
            build_args: |
              CILIUM_RUNTIME_IMAGE=quay.io/isovalent-dev/cilium-runtime-wfi:a23cb179a0f1ca69f3e0a03d46f4748fbf02d204@sha256:ad3ab1a22177673568e44cbbcb4a09ea521fff7c9dd39ee1b6a4386846fe5acd
              OPERATOR_VARIANT=operator-generic

          - name: hubble-relay
            distro: distroless
            dockerfile: ./images/hubble-relay/Dockerfile
            image_name: hubble-relay
            platforms: linux/amd64,linux/arm64
            build_args: |
              CILIUM_RUNTIME_IMAGE=quay.io/isovalent-dev/cilium-runtime-wfi:a23cb179a0f1ca69f3e0a03d46f4748fbf02d204@sha256:ad3ab1a22177673568e44cbbcb4a09ea521fff7c9dd39ee1b6a4386846fe5acd

          - name: clustermesh-apiserver
            distro: distroless
            dockerfile: ./images/clustermesh-apiserver/Dockerfile
            image_name: clustermesh-apiserver
            platforms: linux/amd64,linux/arm64
            build_args: |
              CILIUM_RUNTIME_IMAGE=quay.io/isovalent-dev/cilium-runtime-wfi:a23cb179a0f1ca69f3e0a03d46f4748fbf02d204@sha256:ad3ab1a22177673568e44cbbcb4a09ea521fff7c9dd39ee1b6a4386846fe5acd

          - name: cilium-dnsproxy
            distro: chainguard
            dockerfile: ./enterprise/fqdn-proxy/images/cilium-dnsproxy/Dockerfile
            image_name: cilium-dnsproxy
            platforms: linux/amd64,linux/arm64
            build_args: |
              CILIUM_RUNTIME_IMAGE=quay.io/isovalent-dev/cilium-runtime-wfi:a23cb179a0f1ca69f3e0a03d46f4748fbf02d204@sha256:ad3ab1a22177673568e44cbbcb4a09ea521fff7c9dd39ee1b6a4386846fe5acd

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.SHA || github.sha }}
          persist-credentials: false

      - name: Cleanup Disk space in runner
        if: runner.name == 'ubuntu-24.04'
        uses: ./.github/actions/disk-cleanup

      - name: Set Environment Variables
        uses: ./.github/actions/set-env-variables

      - name: Setup docker volumes into /mnt
        # This allows us to make use of all available disk.
        shell: bash
        run: |
          sudo systemctl stop docker
          sudo mv /var/lib/docker/volumes /mnt/docker-volumes
          sudo ln -s /mnt/docker-volumes /var/lib/docker/volumes
          sudo systemctl start docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        # Disable GC entirely to avoid buildkit from GC caches.
        with:
          buildkitd-config-inline: |
            [worker.oci]
             gc=false

      - name: Login to quay.io for CI
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME_CI }}
          password: ${{ secrets.QUAY_PASSWORD_CI }}

      - name: Login to Artifactory
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.ARTIFACTORY_DEV }}
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Login to registry.redhat.io for CI
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_USERNAME_CI }}
          password: ${{ secrets.REDHAT_PASSWORD_CI }}

      - name: Getting image tag
        id: tag
        run: |
          if [ "${{ inputs.SHA }}" != "" ]; then
            sha=${{ inputs.SHA }}
          else
            sha=${{ github.sha }}
          fi
          echo sha=${sha} >> $GITHUB_OUTPUT

          tag=${sha}
          echo tag=${tag} >> $GITHUB_OUTPUT

          if [[ "${{ github.event_name == 'push' }}" == "true" ]]; then
            if [[ "${{ github.ref_name }}" == "${{ github.event.repository.default_branch }}" ]]; then
              floating_tag=latest
            else
              floating_tag="${{ github.ref_name }}"
              # Remove slashes from branch names
              floating_tag=${floating_tag##*/}
            fi
            echo floating_tag=${floating_tag} >> $GITHUB_OUTPUT
          fi

          # Quay tags
          normal_tag="quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.image_name }}-ci:${tag}"
          race_tag="${normal_tag}-race"
          unstripped_tag="${normal_tag}-unstripped"
          push_tags="${normal_tag}"

          # Artifactory tags
          artifactory_normal_tag="${{ env.ARTIFACTORY_DEV }}/${{ env.ARTIFACTORY_ORGANIZATION_DEV }}/${{ matrix.image_name }}-ci:${tag}"
          artifactory_race_tag="${artifactory_normal_tag}-race"
          artifactory_unstripped_tag="${artifactory_normal_tag}-unstripped"
          artifactory_push_tags="${artifactory_normal_tag}"

          extra_tags="--tag ${normal_tag} --tag ${artifactory_normal_tag}"

          if [ -n "${floating_tag}" ]; then
            floating_normal_tag="quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.image_name }}-ci:${floating_tag}"
            artifactory_floating_normal_tag="${{ env.ARTIFACTORY_DEV }}/${{ env.ARTIFACTORY_ORGANIZATION_DEV }}/${{ matrix.image_name }}-ci:${floating_tag}"
            extra_tags="${extra_tags} --tag ${floating_normal_tag} --tag ${artifactory_floating_normal_tag}"
            if [[ "${{ matrix.distro }}" != "ubi" ]]; then
              push_tags="${normal_tag},${floating_normal_tag}"
              artifactory_push_tags="${artifactory_normal_tag},${artifactory_floating_normal_tag}"
            fi
          fi

          if [[ "${{ github.event_name }}" == 'merge_group' || "${{ github.event_name }}" == 'push' ]]; then
            # Don't build race and unstripped images for merge_group or push events.
            race_tag=""
            unstripped_tag=""
            artifactory_race_tag=""
            artifactory_unstripped_tag=""
          fi

          # digest lookups
          echo primary_tag=${normal_tag} >> $GITHUB_OUTPUT
          # list of tags passed to docker/build-push-action
          echo push_tags=${push_tags} >> $GITHUB_OUTPUT
          echo race_tag=${race_tag} >> $GITHUB_OUTPUT
          echo unstripped_tag=${unstripped_tag} >> $GITHUB_OUTPUT
          echo artifactory_primary_tag=${artifactory_normal_tag} >> $GITHUB_OUTPUT
          echo artifactory_race_tag=${artifactory_race_tag} >> $GITHUB_OUTPUT
          echo artifactory_unstripped_tag=${artifactory_unstripped_tag} >> $GITHUB_OUTPUT
          echo artifactory_push_tags=${artifactory_push_tags} >> $GITHUB_OUTPUT
          echo extra_tags=${extra_tags} >> $GITHUB_OUTPUT

      - name: Check for disk usage
        shell: bash
        run: |
          df -h

      # Load Golang cache build from GitHub
      - name: Restore Golang cache build from GitHub
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: go-cache
        with:
          path: /tmp/.cache/go
          key: ${{ runner.os }}-go-${{ matrix.name }}-cache-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.name }}-cache-

      - name: Check for disk usage
        shell: bash
        run: |
          df -h
          docker buildx du

      - name: Create cache directories if they don't exist
        if: ${{ steps.go-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          mkdir -p /tmp/.cache/go

      # Import GitHub's cache build to docker cache
      - name: Copy ${{ matrix.name }} Golang cache to docker cache
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          provenance: false
          context: /tmp/.cache/go
          file: ./images/cache/Dockerfile
          push: false
          platforms: linux/amd64
          target: import-cache

      - name: Check for disk usage
        shell: bash
        run: |
          df -h
          docker buildx du

      - name: Check build constraints
        id: check
        run: |
          if [[ -z "${{ matrix.require-dir }}" ]] ||
             [[ -d "${{ matrix.require-dir }}" ]]; then
            echo build="true" >> $GITHUB_OUTPUT
          fi

      - name: CI Build ${{ matrix.name }} UBI
        if: ${{ steps.check.outputs.build != '' && matrix.distro == 'ubi' }}
        id: docker_build_ci_ubi
        shell: bash
        working-directory: ./enterprise/images
        run: |
          # shellcheck disable=SC2046
          export $(echo "${{ matrix.build_args }}" | grep -v "^[[:space:]]*#" | xargs)
          IMAGE_TAG=${{ steps.tag.outputs.tag }} \
          REGISTRIES="quay.io/${{ env.QUAY_ORGANIZATION_DEV }} ${{ env.ARTIFACTORY_DEV }}/${{ env.ARTIFACTORY_ORGANIZATION_DEV }}" \
          EXTRA_ARGS="${{ steps.tag.outputs.extra_tags }}" \
          make ${{ matrix.name }}-image

      - name: CI Build ${{ matrix.name }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        if: ${{ steps.check.outputs.build != '' && matrix.distro != 'ubi' }}
        id: docker_build_ci
        with:
          provenance: false
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: |
            ${{ steps.tag.outputs.push_tags }}
            ${{ steps.tag.outputs.artifactory_push_tags }}
          target: release
          build-args: ${{ matrix.build_args }}

      - name: CI race detection Build ${{ matrix.name }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: docker_build_ci_detect_race_condition
        if: ${{ steps.check.outputs.build != '' && steps.tag.outputs.race_tag != '' && matrix.distro != 'ubi' }}
        with:
          provenance: false
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.tag.outputs.race_tag }}
            ${{ steps.tag.outputs.artifactory_race_tag }}
          target: release
          build-args: |
            BASE_IMAGE=quay.io/isovalent-dev/cilium-runtime-wfi:a23cb179a0f1ca69f3e0a03d46f4748fbf02d204@sha256:ad3ab1a22177673568e44cbbcb4a09ea521fff7c9dd39ee1b6a4386846fe5acd
            ${{ matrix.build_args }}
            MODIFIERS="LOCKDEBUG=1 RACE=1"

      - name: CI Unstripped Binaries Build ${{ matrix.name }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        id: docker_build_ci_unstripped
        if: ${{ steps.check.outputs.build != '' && steps.tag.outputs.unstripped_tag != '' && matrix.distro != 'ubi' }}
        with:
          provenance: false
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.tag.outputs.unstripped_tag }}
            ${{ steps.tag.outputs.artifactory_unstripped_tag }}
          target: release
          build-args: |
            ${{ matrix.build_args }}
            MODIFIERS="NOSTRIP=1"

      - name: CI Build ${{ matrix.name }} digest
        id: docker_digest
        if: ${{ steps.check.outputs.build != '' }}
        shell: bash
        run: |
          digest=$(images/scripts/get-image-digest.sh "${{ steps.tag.outputs.primary_tag }}")
          echo digest=${digest} >> $GITHUB_OUTPUT

      - name: CI Build ${{ matrix.name }} digest (Artifactory)
        id: docker_digest_artifactory
        if: ${{ steps.check.outputs.build != '' }}
        shell: bash
        run: |
          digest=$(images/scripts/get-image-digest.sh "${{ steps.tag.outputs.artifactory_primary_tag }}")
          echo digest=${digest} >> $GITHUB_OUTPUT

      - name: CI Image Releases digests
        if: ${{ steps.check.outputs.build != '' }}
        shell: bash
        run: |
          mkdir -p image-digest/
          # shellcheck disable=SC2078
          if [ ${{ github.event_name == 'push' && !startsWith(github.ref_name, 'ft/') }} ]; then
            echo "quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/${{ matrix.image_name }}-ci:${{ steps.tag.outputs.floating_tag }}@${{ steps.docker_digest.outputs.digest }}" > image-digest/${{ matrix.image_name }}.txt
            echo "${{ env.ARTIFACTORY_DEV }}/${{ env.ARTIFACTORY_ORGANIZATION_DEV }}/${{ matrix.image_name }}-ci:${{ steps.tag.outputs.floating_tag }}@${{ steps.docker_digest_artifactory.outputs.digest }}" >> image-digest/${{ matrix.image_name }}.txt
          fi
          echo "${{ steps.tag.outputs.primary_tag}}@${{ steps.docker_digest.outputs.digest }}" >> image-digest/${{ matrix.image_name }}.txt
          echo "${{ steps.tag.outputs.artifactory_primary_tag }}@${{ steps.docker_digest_artifactory.outputs.digest }}" >> image-digest/${{ matrix.image_name }}.txt

      # Upload artifact digests
      - name: Upload artifact digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.check.outputs.build != '' }}
        with:
          name: image-digest ${{ matrix.image_name }}
          path: image-digest
          retention-days: 1

      - name: Check for disk usage
        if: ${{ always() }}
        shell: bash
        run: |
          df -h

  image-digests:
    if: ${{ always() }}
    name: Display Digests
    runs-on: ubuntu-24.04
    needs: build-and-push-prs
    steps:
      - name: Downloading Image Digests
        shell: bash
        run: |
          mkdir -p image-digest/

      - name: Download digests of all images built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: image-digest/
          pattern: "*image-digest *"

      - name: Image Digests Output
        shell: bash
        run: |
          cd image-digest/
          find -type f | sort | xargs -d '\n' cat

  push-chart:
    name: Push dev chart
    needs: build-and-push-prs
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: ./.github/workflows/push-chart-ci.yaml
    with:
      checkout_ref: ${{ needs.build-and-push-prs.outputs.sha }}
      image_tag: ${{ needs.build-and-push-prs.outputs.sha }}
      extra_values_file_changes: |
        {
          "enterprise.gatewayAPI.deployment.controlplane.image.repository": "quay.io/isovalent-dev/gateway-api-controlplane-ci",
          "enterprise.gatewayAPI.deployment.controlplane.image.tag": "${{ needs.build-and-push-prs.outputs.sha }}",
          "enterprise.gatewayAPI.deployment.controlplane.image.digest": "",
          "enterprise.gatewayAPI.deployment.controlplane.image.useDigest": false
        }
    secrets: inherit

  get-author:
    name: Get Author of the PR
    needs: build-and-push-prs
    runs-on: ubuntu-24.04
    outputs:
      author: ${{ steps.get_author.outputs.author }}
    steps:
      - name: Get PR Author
        id: get_author
        run: |
          echo author="$(gh pr view --repo isovalent/cilium ${{ inputs.PR-number }} --json author --jq '.author.login')" >> $GITHUB_OUTPUT

  comment:
    name: Post test comment for Renovate PRs after images built
    runs-on: ubuntu-24.04
    needs: get-author
    environment: "Trigger CI from renovate PRs"
    env:
      GH_TOKEN: ${{ github.token }}
    if: ${{
      github.event_name == 'workflow_dispatch' &&
      needs.get-author.outputs.author == vars.RENOVATE_BOT_USERNAME
      }}
    steps:
      - name: Generate Github App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          app-id: ${{ secrets.AUTO_COMMENT_BOT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMENT_BOT_PEM }}
      - name: Post /test comment
        env:
          TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ inputs.PR-number }}
        run: |
          echo ${TOKEN} | gh auth login --with-token
          gh pr --repo ${GITHUB_REPOSITORY} comment ${PULL_REQUEST_NUMBER} --body "/test"

  merge-upload-and-status:
    name: Merge Upload and Status
    if: ${{ always() }}
    needs: push-chart
    uses: ./.github/workflows/common-post-jobs.yaml
    secrets: inherit
    with:
      context-ref: ${{ inputs.context-ref || github.sha }}
      sha: ${{ inputs.SHA || github.sha }}
      success: ${{ needs.push-chart.result == 'success' }}
