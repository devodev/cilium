name: Enterprise Chainguard Image Release Build

on:
  workflow_call: {}

permissions:
  # To be able to access the repository with `actions/checkout`
  contents: read
  # Required to generate OIDC tokens for `sigstore/cosign-installer` authentication
  id-token: write

jobs:
  build-and-push:
    timeout-minutes: 45
    name: Build and Push Chainguard Images
    environment: release
    runs-on: ${{ vars.GH_RUNNER_EXTRA_POWER_UBUNTU_LATEST || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cilium
            dockerfile: ./enterprise/images/chainguard/cilium/Dockerfile
            platforms: linux/amd64,linux/arm64
            image_name: cilium

          - name: operator
            dockerfile: ./enterprise/images/chainguard/operator/Dockerfile
            platforms: linux/amd64,linux/arm64
            image_name: operator-generic
            build_args: |
              OPERATOR_VARIANT=generic

          - name: operator-aws
            dockerfile: ./enterprise/images/chainguard/operator/Dockerfile
            platforms: linux/amd64,linux/arm64
            image_name: operator-aws
            build_args: |
              OPERATOR_VARIANT=aws

          - name: operator-azure
            dockerfile: ./enterprise/images/chainguard/operator/Dockerfile
            platforms: linux/amd64,linux/arm64
            image_name: operator-azure
            build_args: |
              OPERATOR_VARIANT=azure

          - name: operator-alibabacloud
            dockerfile: ./enterprise/images/chainguard/operator/Dockerfile
            platforms: linux/amd64,linux/arm64
            image_name: operator-alibabacloud
            build_args: |
              OPERATOR_VARIANT=alibabacloud

          - name: hubble-relay
            dockerfile: ./enterprise/images/chainguard/hubble-relay/Dockerfile
            platforms: linux/amd64,linux/arm64
            image_name: hubble-relay

          - name: clustermesh-apiserver
            dockerfile: ./enterprise/images/chainguard/clustermesh-apiserver/Dockerfile
            platforms: linux/amd64,linux/arm64
            image_name: clustermesh-apiserver

          - name: cilium-dnsproxy
            dockerfile: ./enterprise/images/chainguard/cilium-dnsproxy/Dockerfile
            platforms: linux/amd64,linux/arm64
            image_name: cilium-dnsproxy

    steps:
      - name: Checkout tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cleanup Disk space in runner
        if: runner.name == 'ubuntu-24.04'
        uses: ./.github/actions/disk-cleanup

      - name: Set Environment Variables
        uses: ./.github/actions/set-env-variables

      - name: Setup docker volumes into /mnt
        shell: bash
        run: |
          sudo systemctl stop docker
          sudo mv /var/lib/docker/volumes /mnt/docker-volumes
          sudo ln -s /mnt/docker-volumes /var/lib/docker/volumes
          sudo systemctl start docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to Artifactory
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ vars.ARTIFACTORY_HOST }}
          username: ${{ vars.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Getting image tag
        id: tag
        run: |
          tag=${GITHUB_REF##*/}
          echo tag=${tag} >> $GITHUB_OUTPUT

          registry="${{ vars.ARTIFACTORY_HOST }}/isovalent-iep-docker"
          image_tag="${registry}/${{ matrix.image_name }}:${tag}"
          echo image_tag=${image_tag} >> $GITHUB_OUTPUT

      - name: Release Build ${{ matrix.name }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        id: docker_build_release
        with:
          provenance: false
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.tag.outputs.image_tag }}
          build-args: ${{ matrix.build_args }}

      - name: Generate SBOM, Sign Images, and Attach Attestations
        uses: ./.github/actions/cosign
        with:
          image: "${{ vars.ARTIFACTORY_HOST }}/isovalent-iep-docker/${{ matrix.image_name }}@${{ steps.docker_build_release.outputs.digest }}"
          image_tag: "${{ steps.tag.outputs.image_tag }}"
          sbom_name: "${{ matrix.image_name }}_${{ steps.tag.outputs.tag }}"
          upload_sbom_release_assets: 'false'
          registry_url: ${{ vars.ARTIFACTORY_HOST }}
          registry_username: ${{ vars.ARTIFACTORY_USERNAME }}
          registry_password: ${{ secrets.ARTIFACTORY_PASSWORD }}

      - name: Image Release Digest
        shell: bash
        run: |
          mkdir -p image-digest/
          job_name=${{ matrix.image_name }}
          job_name_capital=${job_name^^}
          job_name_underscored=${job_name_capital//-/_}
          echo "${job_name_underscored}_DIGEST := \"${{ steps.docker_build_release.outputs.digest }}\"" > image-digest/makefile-digest.txt

          echo "### ${{ matrix.image_name }}" > image-digest/${{ matrix.image_name }}.txt
          echo "" >> image-digest/${{ matrix.image_name }}.txt
          echo "\`${{ steps.tag.outputs.image_tag }}@${{ steps.docker_build_release.outputs.digest }}\`" >> image-digest/${{ matrix.image_name }}.txt
          echo "" >> image-digest/${{ matrix.image_name }}.txt

      - name: Upload artifact digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest ${{ matrix.image_name }}
          path: image-digest

  image-digests:
    name: Display Digests
    runs-on: ubuntu-24.04
    needs: build-and-push
    steps:
      - name: Getting image tag
        id: tag
        run: |
          echo tag=${GITHUB_REF##*/} >> $GITHUB_OUTPUT

      - name: Downloading Image Digests
        shell: bash
        run: |
          mkdir -p image-digest/

      - name: Download digests of all images built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: image-digest/
          pattern: "*image-digest *"

      - name: Image Digests Output
        shell: bash
        run: |
          cd image-digest/
          echo "## Docker Manifests" > ../image-digest-output.txt
          echo "" >> ../image-digest-output.txt
          find -type f -regex ".*image-digest .*" -not -name "makefile-digest.txt" | sort | xargs -d '\n' cat >> ../image-digest-output.txt

      - name: Image Makefile Digests
        shell: bash
        run: |
          cd image-digest/
          echo "# File generated by .github/workflows/enterprise-build-images-releases-chainguard.yaml; DO NOT EDIT." > ../Makefile.digests
          echo "# Copyright $(date +'%Y') Authors of Cilium" >> ../Makefile.digests
          echo "# SPDX-License-Identifier: Apache-2.0" >> ../Makefile.digests
          echo "" >> ../Makefile.digests
          # shellcheck disable=SC2016
          find -type f -name "makefile-digest.txt" | sort | xargs -d '\n' awk '{print "export " $0}' >> ../Makefile.digests

      - name: Upload artifact digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-output.txt-${{ steps.tag.outputs.tag }}
          path: image-digest-output.txt

      - name: Upload Makefile digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Makefile.digests-${{ steps.tag.outputs.tag }}
          path: Makefile.digests
