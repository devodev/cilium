name: Enterprise Egress Gateway HA on EKS (ci-egress-gateway-ha-eks)

on:
  schedule:
    - cron: "0 0 * * 1-5"

  workflow_dispatch:
    inputs:
      PR-number:
        description: "Pull request number."
        required: true
      context-ref:
        description: "Context in which the workflow runs. If PR is from a fork, will be the PR target branch (general case). If PR is NOT from a fork, will be the PR branch itself (this allows committers to test changes to workflows directly from PRs)."
        required: true
      SHA:
        description: "SHA under test (head of the PR branch)."
        required: true
      base-SHA:
        description: "SHA of the base branch (target branch of the PR)."
        required: false
      extra-args:
        description: "[JSON object] Arbitrary arguments passed from the trigger comment via regex capture group. Parse with 'fromJson(inputs.extra-args).argName' in workflow."
        required: false
        default: "{}"

# For testing uncomment following lines:
#  push:
#    branches:
#      - your_branch_name

permissions:
  # To be able to access the repository with actions/checkout
  contents: read
  # To be able to request the JWT from GitHub's OIDC provider
  id-token: write
  # To allow retrieving information from the PR API
  pull-requests: read
  # To be able to set commit status
  statuses: write

concurrency:
  # Structure:
  # - Workflow name
  # - Event type
  # - A unique identifier depending on event type:
  #   - schedule: SHA
  #   - workflow_dispatch: PR number
  #
  # This structure ensures a unique concurrency group name is generated for each
  # type of testing, such that re-runs will cancel the previous run.
  group: |
    ${{ github.workflow }}
    ${{ github.event_name }}
    ${{
      (github.event_name == 'push' && github.sha) ||
      (github.event_name == 'schedule' && github.sha) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.PR-number)
    }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=eksctl-io/eksctl
  eksctl_version: v0.229.0
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  kubectl_version: v1.36.2

  test_name: egwha-eks
  cluster_name: ${{ github.run_id }}-${{ github.run_attempt }}

  aws_asn: 65000
  peer_asn: 65001
  enable_bfd: true
  ipam_cidr: 10.0.100.1/30
  conn_disrupt_egw_ha_egress_cidrs: 10.0.101.1/30,10.0.102.1/30
jobs:
  echo-inputs:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Echo Workflow Dispatch Inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Echo Workflow Dispatch Inputs
        run: |
          echo '${{ tojson(inputs) }}'

  commit-status-start:
    name: Commit Status Start
    runs-on: ubuntu-24.04
    steps:
      - name: Set initial commit status
        uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # v2.0.1
        with:
          sha: ${{ inputs.SHA || github.sha }}

  wait-for-images:
    name: Wait for images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout context ref (trusted)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.context-ref || github.sha }}
          persist-credentials: false
      - name: Wait for images
        uses: ./.github/actions/wait-for-images
        with:
          SHA: ${{ inputs.SHA || github.sha }}
          images: cilium-ci operator-aws-ci cilium-cli-ci

  install-and-connectivity:
    runs-on: ubuntu-24.04
    name: Setup and Test
    needs: wait-for-images
    timeout-minutes: 120
    steps:
      - name: Checkout context ref (trusted)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.context-ref || github.sha }}
          persist-credentials: false

      - name: Set Environment Variables
        uses: ./.github/actions/set-env-variables

      - name: Set up job variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] ; then
            SHA="${{ inputs.SHA }}"
          else
            SHA="${{ github.sha }}"
          fi

          CILIUM_DOWNGRADE_VERSION=$(contrib/scripts/print-downgrade-version.sh stable)
          echo "CILIUM_DOWNGRADE_VERSION: ${CILIUM_DOWNGRADE_VERSION}"
          if [ -z "${CILIUM_DOWNGRADE_VERSION}" ]; then
            echo "::notice::No CILIUM_DOWNGRADE_VERSION returned; skipping upgrade/downgrade steps"
          fi

          CILIUM_INSTALL_DEFAULTS=" \
            --wait=false \
            --set=debug.enabled=true \
            --set=cluster.name=${{ env.cluster_name }} \
            --set=enterprise.egressGatewayHA.enabled=true \
            --set=enterprise.egressGatewayHA.socketTermination.enabled=true \
            --set=enterprise.featureGate.approved='{EgressGatewayHA,EgressGatewayHASocketTermination,BFD,DNSProxyHA}' \
            --set=enterprise.bgpControlPlane.enabled=true \
            --set=enterprise.bfd.enabled=true \
            --set=enterprise.dnsProxyHA.enabled=true \
            --set=enableIPv4Masquerade=true \
            --set=bpf.masquerade=true \
            --set=kubeProxyReplacement=true \
            --set=eni.enabled=true \
            --set=ipam.mode=eni \
            --set=eni.awsEnablePrefixDelegation=true \
            --set=updateStrategy.rollingUpdate.maxUnavailable=1 \
            --set=minReadySeconds=15 \
            --nodes-without-cilium
          "

          CILIUM_INSTALL_NEWEST=" \
            --chart-directory=untrusted/cilium-newest/install/kubernetes/cilium \
            ${CILIUM_INSTALL_DEFAULTS} \
            --set=image.override=quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/cilium-ci:${SHA} \
            --set=operator.image.override=quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/operator-aws-ci:${SHA}
          "

          CONNECTIVITY_TEST_DEFAULTS=" \
            --hubble=false \
            --log-code-owners --code-owners=${CILIUM_CLI_CODE_OWNERS_PATHS} \
            --exclude-code-owners=${CILIUM_CLI_EXCLUDE_OWNERS} \
            --flow-validation=disabled \
            --include-unsafe-tests \
            --collect-sysdump-on-failure \
            --log-check-extra-exceptions=cleanup-peer-config-status \
            --log-check-extra-exceptions='failed to update node spec: Operation cannot be fulfilled on ciliumnodes.cilium.io' \
            --log-check-extra-exceptions='restart flag is not set' \
            --log-check-extra-exceptions='received notification' \
            --log-check-extra-exceptions='failed to send'
          "

          OWNER="${{ github.ref_name }}"
          OWNER="${OWNER//[.\/]/-}"

          # m5n.xlarge instances support up to 25Gbps burst bandwidth.
          NODE_INSTANCE_TYPE="m5n.xlarge"

          CLUSTER_NAME="${{ env.test_name }}-${{ env.cluster_name }}"

          eks_version_and_region=$(yq '.include | sort_by(.version) | reverse | .[0] | "\(.version),\(.region)"' .github/actions/eks/k8s-versions.yaml)
          EKS_VERSION=$(echo $eks_version_and_region | cut -d',' -f1)
          EKS_REGION=$(echo $eks_version_and_region | cut -d',' -f2)

          echo sha=${SHA} >> $GITHUB_OUTPUT
          echo downgrade_version=${CILIUM_DOWNGRADE_VERSION} >> $GITHUB_OUTPUT
          echo cilium_install_defaults=${CILIUM_INSTALL_DEFAULTS} >> $GITHUB_OUTPUT
          echo cilium_install_newest=${CILIUM_INSTALL_NEWEST} >> $GITHUB_OUTPUT
          echo connectivity_test_defaults=${CONNECTIVITY_TEST_DEFAULTS} >> $GITHUB_OUTPUT
          echo owner=${OWNER} >> $GITHUB_OUTPUT
          echo cluster_name=${CLUSTER_NAME} >> $GITHUB_OUTPUT
          echo node_instance_type=${NODE_INSTANCE_TYPE} >> $GITHUB_OUTPUT
          echo eks_version=${EKS_VERSION} >> $GITHUB_OUTPUT
          echo eks_region=${EKS_REGION} >> $GITHUB_OUTPUT
          echo eks_zone_1=${EKS_REGION}b >> $GITHUB_OUTPUT
          echo eks_zone_2=${EKS_REGION}c >> $GITHUB_OUTPUT

      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/${{ env.kubectl_version }}/bin/linux/amd64/kubectl"
          curl -sLO "https://dl.k8s.io/${{ env.kubectl_version }}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install eksctl CLI
        run: |
          curl -LO "https://github.com/eksctl-io/eksctl/releases/download/${{ env.eksctl_version }}/eksctl_$(uname -s)_amd64.tar.gz"
          sudo tar -xzvf "eksctl_$(uname -s)_amd64.tar.gz" -C /usr/bin
          rm "eksctl_$(uname -s)_amd64.tar.gz"

      - name: Set up AWS CLI credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_PR_ASSUME_ROLE }}
          aws-region: ${{ steps.vars.outputs.eks_region }}

      - name: Display version info of installed tools
        run: |
          echo "--- kubectl ---"
          kubectl version --client
          echo "--- eksctl ---"
          eksctl version

      - name: Checkout ${{ steps.vars.outputs.downgrade_version }} branch to get the Helm chart
        if: ${{ steps.vars.outputs.downgrade_version != '' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.vars.outputs.downgrade_version }}
          persist-credentials: false
          path: untrusted/cilium-downgrade
          sparse-checkout: |
            install/kubernetes/cilium

      - name: Retrieve downgrade target SHA
        if: ${{ steps.vars.outputs.downgrade_version != '' }}
        id: downgrade-branch
        run: |
          echo "sha=$(cd untrusted/cilium-downgrade && git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Wait for images to be available (downgrade)
        if: ${{ steps.vars.outputs.downgrade_version != '' }}
        timeout-minutes: 10
        shell: bash
        run: |
          for image in cilium-ci operator-aws-ci ; do
            until docker manifest inspect quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/$image:${{ steps.downgrade-branch.outputs.sha }} &> /dev/null; do sleep 45s; done
          done

      - name: Create EKS cluster
        id: deploy-cluster
        uses: ./.github/actions/setup-eks-cluster
        with:
          cluster_name: ${{ steps.vars.outputs.cluster_name }}
          region: ${{ steps.vars.outputs.eks_region }}
          zones: "${{ steps.vars.outputs.eks_zone_1 }} ${{ steps.vars.outputs.eks_zone_2 }}"
          owner: "${{ steps.vars.outputs.owner }}"
          version: "${{ steps.vars.outputs.eks_version }}"
          addons: "coredns"

      - name: Generate cilium-cli kubeconfig
        id: gen-kubeconfig
        uses: ./.github/actions/get-cloud-kubeconfig
        with:
          kubeconfig: "~/.kube/config"

      - name: Install Cilium CLI
        uses: cilium/cilium-cli@e391e739db83a8b888ecf18786af6853c51a0c58 # v0.19.5
        with:
          skip-build: ${{ env.CILIUM_CLI_SKIP_BUILD }}
          image-repo: ${{ env.CILIUM_CLI_IMAGE_REPO }}
          image-tag: ${{ inputs.SHA || github.sha }}
          repository: ${{ env.CILIUM_CLI_RELEASE_REPO }}
          release-version: ${{ env.CILIUM_CLI_VERSION }}
          kubeconfig: ${{ steps.gen-kubeconfig.outputs.kubeconfig_path }}

      # Warning: since this is a privileged workflow, subsequent workflow job
      # steps must take care not to execute untrusted code.
      - name: Checkout pull request branch (NOT TRUSTED)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.vars.outputs.sha }}
          persist-credentials: false
          path: untrusted/cilium-newest
          sparse-checkout: |
            install/kubernetes/cilium

      - name: Set up downgrade settings
        if: ${{ steps.vars.outputs.downgrade_version != '' }}
        id: downgrade-vars
        run: |
          CILIUM_INSTALL_STABLE=" \
            --chart-directory=untrusted/cilium-downgrade/install/kubernetes/cilium \
            ${{ steps.vars.outputs.cilium_install_defaults }} \
            --set=image.override=quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/cilium-ci:${{ steps.downgrade-branch.outputs.sha }} \
            --set=operator.image.override=quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/operator-aws-ci:${{ steps.downgrade-branch.outputs.sha }}
          "
          echo cilium_install_stable=${CILIUM_INSTALL_STABLE} >> $GITHUB_OUTPUT

      - name: Install Cilium ${{ steps.vars.outputs.downgrade_version }}
        id: install-cilium
        run: |
          K8S_API_SRV_ADDR=$(kubectl config view -o jsonpath='{.clusters[0].cluster.server}' | sed 's|https://||')
          echo "Retrieved Kubernetes API Server address: '${K8S_API_SRV_ADDR}'"

          # Retrieve the CIDR associated with the availability zone where the cluster
          # is deployed, and configure it as native routing CIDR. Otherwise, Cilium
          # would default to the VPC CIDR, but we want to masquerade traffic towards
          # the external destination (which is located in the same VPC, but different
          # availability zone), to reflect the most common type of real deployments.
          NATIVE_CIDR_BLOCK=$(aws ec2 describe-subnets --region ${{ steps.vars.outputs.eks_region }} \
            --filters Name=availability-zone,Values=${{ steps.vars.outputs.eks_zone_1 }} \
                Name=tag:alpha.eksctl.io/cluster-name,Values=${{ steps.vars.outputs.cluster_name }} \
                Name=map-public-ip-on-launch,Values=false \
            --query 'Subnets[*].CidrBlock' --output text)
          echo "Retrieved native routing CIDR: '${NATIVE_CIDR_BLOCK}'"

          CLUSTER_FLAGS="--set=k8sServiceHost=${K8S_API_SRV_ADDR} --set=k8sServicePort=443 --set=ipv4NativeRoutingCIDR=${NATIVE_CIDR_BLOCK}"

          if [ -n "${{ steps.vars.outputs.downgrade_version }}" ]; then
            cilium install --dry-run-helm-values ${{ steps.downgrade-vars.outputs.cilium_install_stable }} ${CLUSTER_FLAGS}
            cilium install ${{ steps.downgrade-vars.outputs.cilium_install_stable }} ${CLUSTER_FLAGS}
          else
            cilium install --dry-run-helm-values ${{ steps.vars.outputs.cilium_install_newest }} ${CLUSTER_FLAGS}
            cilium install ${{ steps.vars.outputs.cilium_install_newest }} ${CLUSTER_FLAGS}
          fi

          echo k8s_api_srv_addr=${K8S_API_SRV_ADDR} >> $GITHUB_OUTPUT
          echo native_cidr_block=${NATIVE_CIDR_BLOCK} >> $GITHUB_OUTPUT

      # This needs to be performed in a different step, because nodeGroups are not
      # supported during cluster creation in a cluster without VPC CNI. Cilium is
      # also required to be already installed for the step to complete successfully.
      - name: Create EKS nodegroups
        shell: bash
        run: |
          cat <<EOF > eks-nodegroup.yaml
          apiVersion: eksctl.io/v1alpha5
          kind: ClusterConfig

          metadata:
            name: ${{ steps.vars.outputs.cluster_name }}
            region: ${{ steps.vars.outputs.eks_region }}
            version: "${{ steps.vars.outputs.eks_version }}"
            tags:
              usage: "${{ github.repository_owner }}-${{ github.event.repository.name }}"
              owner: "${{ steps.vars.outputs.owner }}"
              svic_osquery_supported: "no"

          managedNodeGroups:
          - name: ng-amd64-egw-node
            instanceTypes:
            - ${{ steps.vars.outputs.node_instance_type }}
            availabilityZones:
            - ${{ steps.vars.outputs.eks_zone_1 }}
            desiredCapacity: 3
            spot: false
            privateNetworking: true
            taints:
            - key: "node.cilium.io/agent-not-ready"
              value: "true"
              effect: "NoExecute"
            labels:
              egress-group: "test"
              rr-role: "client"
          - name: ng-amd64-rr-node
            instanceTypes:
            - ${{ steps.vars.outputs.node_instance_type }}
            availabilityZones:
            - ${{ steps.vars.outputs.eks_zone_1 }}
            desiredCapacity: 2
            spot: false
            privateNetworking: true
            taints:
            - key: "node.cilium.io/agent-not-ready"
              value: "true"
              effect: "NoExecute"
            labels:
              rr-role: "route-reflector"
          - name: ng-amd64-no-cilium
            instanceTypes:
            - ${{ steps.vars.outputs.node_instance_type }}
            availabilityZones:
            - ${{ steps.vars.outputs.eks_zone_2 }}
            desiredCapacity: 1
            spot: false
            privateNetworking: true
            taints:
            - key: "cilium.io/no-schedule"
              value: "true"
              effect: "NoSchedule"
            labels:
              cilium.io/no-schedule: "true"
            # Manually inject a dummy CNI configuration to let the Kubelet turn
            # ready. This is necessary as otherwise the node creation would
            # never complete. Regardless, no pods will be scheduled here given
            # that the node is tainted.
            preBootstrapCommands:
            - "echo '{ \"cniVersion\": \"0.3.1\", \"name\": \"dummy\", \"type\": \"dummy-cni\", \"log-file\": \"/var/run/dummy.log\" }' > /etc/cni/net.d/05-dummy.conf"
          EOF

          eksctl create nodegroup -f ./eks-nodegroup.yaml --timeout=10m

      - name: Wait for Cilium status to be ready
        run: |
          cilium status --wait --interactive=false

      - name: Install Cilium DNS proxy
        run: |
          helm install -n kube-system cilium-dnsproxy ./enterprise/fqdn-proxy/installation \
            --set image.repository=quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/cilium-dnsproxy-ci \
            --set image.tag=${{ steps.vars.outputs.sha }} \
            --set metrics.enabled=true \
            --set debug=true
          kubectl rollout status -n kube-system ds/cilium-dnsproxy --watch

      - name: Setup VPC Route Server
        id: setup-vpc-route-server
        run: |
          bash ./.github/enterprise-egw-ha/setup-vpc-route-server.sh "${{ steps.vars.outputs.cluster_name }}" "${{ env.aws_asn }}" "${{ env.peer_asn }}" "${{ env.enable_bfd }}"

      - name: Build conn-disrupt test args
        id: conn-disrupt
        run: |
          CONN_DISRUPT_SETUP_ARGS=" \
            --include-conn-disrupt-test-egw-ha \
            --include-unsafe-tests \
            --conn-disrupt-test-setup \
            --conn-disrupt-dispatch-interval 0ms \
            --conn-disrupt-test-restarts-path ./cilium-conn-disrupt-restarts \
            --conn-disrupt-egw-ha-egress-cidrs ${{ env.conn_disrupt_egw_ha_egress_cidrs }} \
            --egw-bgp-peer-addresses ${{ steps.setup-vpc-route-server.outputs.route_server_endpoint_ip }}
          "
          CONN_DISRUPT_CHECK_ARGS=" \
            --include-unsafe-tests \
            --include-conn-disrupt-test-egw-ha \
            --collect-sysdump-on-failure \
            --sysdump-hubble-flows-count=1000000 \
            --sysdump-hubble-flows-timeout=5m \
            --sysdump-output-filename 'cilium-sysdump-conn-disrupt-<ts>' \
            --conn-disrupt-test-restarts-path ./cilium-conn-disrupt-restarts \
            --flush-ct \
            --test no-interrupted-connections-for-enterprise
          "
          echo conn_disrupt_setup_args=${CONN_DISRUPT_SETUP_ARGS} >> $GITHUB_OUTPUT
          echo conn_disrupt_check_args=${CONN_DISRUPT_CHECK_ARGS} >> $GITHUB_OUTPUT

      - name: Setup conn-disrupt before upgrade
        if: ${{ steps.vars.outputs.downgrade_version != '' }}
        run: |
          cilium connectivity test ${{ steps.conn-disrupt.outputs.conn_disrupt_setup_args }}

      - name: Upgrade Cilium
        if: ${{ steps.vars.outputs.downgrade_version != '' }}
        shell: bash
        run: |
          cilium upgrade --reset-values \
            --helm-set=disableEnvoyVersionCheck=true \
            ${{ steps.vars.outputs.cilium_install_newest }} \
            --set=k8sServiceHost="${{ steps.install-cilium.outputs.k8s_api_srv_addr }}" \
            --set=k8sServicePort=443 \
            --set=ipv4NativeRoutingCIDR="${{ steps.install-cilium.outputs.native_cidr_block }}"

          cilium status --wait --interactive=false --wait-duration=10m
          kubectl get pods --all-namespaces -o wide
          kubectl -n kube-system exec daemonset/cilium -c cilium-agent -- cilium-dbg status

      - name: Check conn-disrupt after upgrade
        if: ${{ steps.vars.outputs.downgrade_version != '' }}
        run: |
          cilium connectivity test ${{ steps.conn-disrupt.outputs.conn_disrupt_check_args }}

      - name: Run connectivity egress gateway ha test
        run: |
          cilium connectivity test \
            --namespace kube-system \
            ${{ steps.vars.outputs.connectivity_test_defaults }} \
            --test='seq-egress-gateway-ha-ipam-bgp-advertisement' \
            --test='seq-egress-gateway-ha-ipam-bgp-advertisement-with-l7-policy' \
            --test='seq-egress-gateway-ha-ipam-bgp-advertisement-virtual-ip' \
            --test='check-log-errors' \
            --egw-bgp-peer-addresses ${{ steps.setup-vpc-route-server.outputs.route_server_endpoint_ip }} \
            --egw-ipam-cidrs ${{ env.ipam_cidr }}

      - name: Setup conn-disrupt before maintenance test
        run: |
          cilium connectivity test ${{ steps.conn-disrupt.outputs.conn_disrupt_setup_args }}

      - name: Cordon GW nodes and restart Cilium
        run: |
          kubectl cordon -l egress-group=test,rr-role=client

          # Wait for the operator to observe the cordon and remove the activeGatewayIPs
          for _ in $(seq 30); do
            active=$(kubectl get iegp \
              -o jsonpath='{.items[*].status.groupStatuses[*].activeGatewayIPs[*]}')
            if [ -z "$active" ]; then break; fi
            echo "Waiting for active gateways to be removed (current: $active)"
            sleep 2
          done
          if [ -n "$active" ]; then
            echo "ERROR: IEGPs still have active gateways after 60s: $active"
            kubectl get iegp -o yaml
            exit 1
          fi
          echo "All IEGPs have no active gateways, operator observed cordon"

          kubectl -n kube-system rollout restart daemonset/cilium
          kubectl -n kube-system rollout restart deployment/cilium-operator
          kubectl -n kube-system rollout status  daemonset/cilium --timeout=10m
          kubectl -n kube-system rollout status  deployment/cilium-operator --timeout=5m

          cilium status --wait --interactive=false --wait-duration=10m
          kubectl get pods --all-namespaces -o wide
          kubectl -n kube-system exec daemonset/cilium -c cilium-agent -- cilium-dbg status

          kubectl uncordon -l egress-group=test,rr-role=client

      - name: Check conn-disrupt after maintenance test
        run: |
          cilium connectivity test ${{ steps.conn-disrupt.outputs.conn_disrupt_check_args }}

      - name: Setup conn-disrupt before downgrade
        if: ${{ steps.vars.outputs.downgrade_version != '' }}
        run: |
          cilium connectivity test ${{ steps.conn-disrupt.outputs.conn_disrupt_setup_args }}

      - name: Downgrade to Cilium ${{ steps.vars.outputs.downgrade_version }}
        if: ${{ steps.vars.outputs.downgrade_version != '' }}
        shell: bash
        run: |
          cilium upgrade --reset-values \
            --helm-set=disableEnvoyVersionCheck=true \
            ${{ steps.downgrade-vars.outputs.cilium_install_stable }} \
            --set=k8sServiceHost="${{ steps.install-cilium.outputs.k8s_api_srv_addr }}" \
            --set=k8sServicePort=443 \
            --set=ipv4NativeRoutingCIDR="${{ steps.install-cilium.outputs.native_cidr_block }}"

          cilium status --wait --interactive=false --wait-duration=10m
          kubectl get pods --all-namespaces -o wide
          kubectl -n kube-system exec daemonset/cilium -c cilium-agent -- cilium-dbg status

      - name: Check conn-disrupt after downgrade
        if: ${{ steps.vars.outputs.downgrade_version != '' }}
        run: |
          cilium connectivity test ${{ steps.conn-disrupt.outputs.conn_disrupt_check_args }}

      - name: Post-test information gathering
        if: ${{ !success() && steps.install-cilium.outcome != 'skipped' && steps.install-cilium.outcome != 'cancelled' }}
        run: |
          kubectl get pods --all-namespaces -o wide
          cilium status
          cilium sysdump \
            --output-filename cilium-sysdump-final
          sudo chmod +r cilium-sysdump-final.zip

      - name: Upload artifacts
        if: ${{ !success() && steps.install-cilium.outcome != 'skipped' && steps.install-cilium.outcome != 'cancelled' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cilium-sysdumps
          path: cilium-sysdump-*.zip
          retention-days: 5

      - name: Delete context refs
        if: ${{ always() }}
        run: |
          rm -rf untrusted/

      # Refresh credentials
      - name: Set up AWS CLI credentials
        if:  ${{ always() }}
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_PR_ASSUME_ROLE }}
          aws-region: ${{ steps.vars.outputs.eks_region }}

      - name: Cleanup VPC route server
        if: ${{ always() && steps.setup-vpc-route-server.outcome != 'skipped' }}
        run: |
          bash ./.github/enterprise-egw-ha/delete-vpc-route-server.sh "${{ steps.setup-vpc-route-server.outputs.route_server_id }}" "${{ steps.vars.outputs.cluster_name }}"

      - name: Cleanup cluster
        if: ${{ always() && steps.deploy-cluster.outcome != 'skipped' }}
        run: |
          eksctl delete cluster --name ${{ steps.vars.outputs.cluster_name }} --region ${{ steps.vars.outputs.eks_region }}

  commit-status-final:
    if: ${{ always() }}
    name: Commit Status Final
    needs: install-and-connectivity
    runs-on: ubuntu-24.04
    steps:
      - name: Set final commit status
        uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # v2.0.1
        with:
          sha: ${{ inputs.SHA || github.sha }}
          status: ${{ needs.install-and-connectivity.result }}
