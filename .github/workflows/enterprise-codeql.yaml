name: Enterprise CodeQL

on:
  workflow_dispatch:
  schedule:
    # Run at the end of every day from Monday to Friday
    - cron: '0 0 * * 1-5'

permissions: {}

jobs:
  analyze:
    name: Analyze
    uses: isovalent/reusable-workflows/.github/workflows/codeql.yaml@ab4888b9078f03883bf2e399959b9df377fcac1d # v0.13.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["actions"]'

  analyze-go:
    name: Analyze Go
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: go
          build-mode: manual

      - name: Build agent
        working-directory: ./daemon
        run: make

      - name: Build operator
        working-directory: ./operator
        run: make

      - name: Build hubble-relay
        working-directory: ./hubble-relay
        run: make

      - name: Build clustermesh-apiserver
        working-directory: ./clustermesh-apiserver
        run: make

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          category: '/language:go'
