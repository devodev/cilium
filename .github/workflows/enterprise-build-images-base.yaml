name: Wolfi Base Image Release Build

# Any change in triggers needs to be reflected in the concurrency group.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - enterprise/images/wolfi/runtime/**
      - enterprise/images/wolfi/runtime-base/**
  # This workflow can be reused so that renovate can execute this workflow_dispatch:
  # run from a different environment than 'release-base-images'. See
  # build-images-base-renovate.yaml
  workflow_call:
    inputs:
      environment:
        type: string
        default: 'release-base-images'

permissions:
  # To be able to access the repository with `actions/checkout`
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Images
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'release-base-images' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Get token
        uses: getsentry/action-github-app-token@5c1e90706fe007857338ac1bfbd7a4177db2f789 # v4.0.0
        id: get_token
        with:
          private_key: ${{ secrets.ISOVALENT_MIRROR_UPSTREAM_BOT_APP_PEM }}
          app_id: ${{ secrets.ISOVALENT_MIRROR_UPSTREAM_BOT_APP_ID }}

      - name: Checkout default branch (trusted)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
          token: ${{ steps.get_token.outputs.token }}

      - name: Cleanup Disk space in runner
        uses: ./.github/actions/disk-cleanup

      - name: Checkout base branch (trusted)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: true
          token: ${{ steps.get_token.outputs.token }}

      - name: Set Environment Variables
        uses: ./.github/actions/set-env-variables

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Checkout pull request branch (NOT TRUSTED)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.get_token.outputs.token }}

      - name: Set-up git
        run: |
          git config user.name "Isovalent Imagebot"
          git config user.email "noreply@isovalent.com"

      - name: Generating image tag for cilium-runtime-base-wfi and verify if it exists already
        id: runtime-base-tag
        run: |
          base_tag=$(git ls-tree --full-tree --object-only HEAD -- ./enterprise/images/wolfi/runtime-base)
          echo tag="$base_tag" >> $GITHUB_OUTPUT

          if docker buildx imagetools inspect quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/cilium-runtime-base-wfi:$base_tag &>/dev/null; then
            echo exists="true" >> $GITHUB_OUTPUT
          else
            echo exists="false" >> $GITHUB_OUTPUT
          fi

      - name: Login to quay.io
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME_CI }}
          password: ${{ secrets.QUAY_PASSWORD_CI }}

      - name: Release enterprise-runtime-base
        if: ${{ steps.runtime-base-tag.outputs.exists == 'false' }}
        id: enterprise-runtime-base-release
        uses: chainguard-images/actions/apko-publish@b60767bcc68220a0afc419dc14f59b230157eba7 # main
        with:
          config: ./enterprise/images/wolfi/runtime-base/image.yaml
          tag: quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/cilium-runtime-base-wfi:${{  steps.runtime-base-tag.outputs.tag }}
          generic-user: ${{ secrets.QUAY_USERNAME_CI }}
          generic-pass: ${{ secrets.QUAY_PASSWORD_CI }}

      - name: Update Runtime Base Image
        id: update-runtime-base-image
        if: ${{ steps.runtime-base-tag.outputs.exists == 'false' }}
        run: |
          digest=$(images/scripts/get-image-digest.sh "quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/cilium-runtime-base-wfi:${{ steps.runtime-base-tag.outputs.tag }}")
          enterprise/images/wolfi/runtime-base/update-enterprise-runtime-base-image.sh "quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/cilium-runtime-base-wfi:${{ steps.runtime-base-tag.outputs.tag }}@${digest}"
          git commit -sam "images: update CEE cilium-runtime-base-wfi"
          echo committed="true" >> $GITHUB_OUTPUT

      # stage 2 of the workflow, updating cilium-runtime-wfi
      - name: Generating image tag for cilium-runtime-wfi
        id: runtime-tag
        run: |
          echo tag="$(git ls-tree --full-tree HEAD -- ./enterprise/images/wolfi/runtime | awk '{ print $3 }')" >> $GITHUB_OUTPUT

      - name: Checking if tag for cilium-runtime-wfi already exists
        if: ${{ steps.runtime-base-tag.outputs.exists == 'true' }}
        id: cilium-enterprise-runtime-tag-in-repositories
        shell: bash
        run: |
          if docker buildx imagetools inspect quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/cilium-runtime-wfi:${{  steps.runtime-tag.outputs.tag }} &>/dev/null; then
            echo exists="true" >> $GITHUB_OUTPUT
          else
            echo exists="false" >> $GITHUB_OUTPUT
          fi

      - name: Release build cilium-runtime-wfi
        if: ${{ steps.runtime-base-tag.outputs.exists == 'true' && steps.cilium-enterprise-runtime-tag-in-repositories.outputs.exists == 'false' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: docker_build_release_builder
        with:
          provenance: false
          context: .
          file: ./enterprise/images/wolfi/runtime/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/cilium-runtime-wfi:${{  steps.runtime-tag.outputs.tag }}

      - name: Update Runtime Image
        id: update-runtime-image
        if: ${{ steps.runtime-base-tag.outputs.exists == 'true' && steps.cilium-enterprise-runtime-tag-in-repositories.outputs.exists == 'false' }}
        run: |
          digest=$(images/scripts/get-image-digest.sh "quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/cilium-runtime-wfi:${{ steps.runtime-tag.outputs.tag }}")
          enterprise/images/wolfi/runtime/update-cilium-runtime-image.sh "quay.io/${{ env.QUAY_ORGANIZATION_DEV }}/cilium-runtime-wfi:${{ steps.runtime-tag.outputs.tag }}@${digest}"
          git commit -sam "images: update CEE cilium-runtime-wfi"
          echo committed="true" >> $GITHUB_OUTPUT

      - name: Push changes into PR
        if: ${{ steps.update-runtime-base-image.outputs.committed == 'true' ||  steps.update-runtime-image.outputs.committed == 'true' }}
        env:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository:  ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          git diff HEAD^
          git push https://x-access-token:${{ steps.get_token.outputs.token }}@github.com/${{ env.repository }}.git HEAD:${{ env.ref }}
