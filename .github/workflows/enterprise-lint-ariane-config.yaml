name: Ariane Enterprise Config linter

# Any change in triggers needs to be reflected in the concurrency group.
on:
  workflow_dispatch:
    inputs:
      PR-number:
        description: "Pull request number."
        required: true
      context-ref:
        description: "Context in which the workflow runs. If PR is from a fork, will be the PR target branch (general case). If PR is NOT from a fork, will be the PR branch itself (this allows committers to test changes to workflows directly from PRs)."
        required: true
      SHA:
        description: "SHA under test (head of the PR branch)."
        required: true
      base-SHA:
        description: "SHA of the base branch (target branch of the PR)."
        required: false
      extra-args:
        description: "[JSON object] Arbitrary arguments passed from the trigger comment via regex capture group. Parse with 'fromJson(inputs.extra-args).argName' in workflow."
        required: false
        default: '{}'

# By specifying the access of one of the scopes, all of those that are not
# specified are set to 'none'.
permissions:
  # To read actions state with catchpoint/workflow-telemetry-action
  actions: read
  # To be able to access the repository with actions/checkout
  contents: read
  # To allow retrieving information from the PR API
  pull-requests: read
  # To be able to set commit status
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.PR-number }}
  cancel-in-progress: true

jobs:
  echo-inputs:
    name: Echo Workflow Dispatch Inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Echo Workflow Dispatch Inputs
        run: |
          echo '${{ tojson(inputs) }}'

  commit-status-start:
    name: Commit Status Start
    runs-on: ubuntu-24.04
    steps:
      - name: Set initial commit status
        uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # v2.0.1
        with:
          sha: ${{ inputs.SHA || github.sha }}

  lint-ariane-enterprise-config:
    name: Lint Ginkgo Workflows Comments
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          path: src/github.com/isovalent/cilium

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.0

      - name: Generate Github App Token
        id: get-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ISOVALENT_READONLY_GH_APP_ID }}
          private-key: ${{ secrets.ISOVALENT_READONLY_GH_APP_PEM }}
          owner: isovalent
          repositories: ariane

      - name: Authenticate with GH CLI
        run: |
          git config --global url."https://x-access-token:${{ steps.get-token.outputs.token }}@github.com/isovalent".insteadOf "https://github.com/isovalent"

      - name: Install Ariane linter
        shell: bash
        env:
          GOPRIVATE: github.com/isovalent
          GONOSUMDB: github.com/isovalent
        run: |
          go install github.com/isovalent/ariane/linter@587090a25b7c1b5bf3b5205ed45819d74d62457f

      - name: Lint Ariane config
        shell: bash
        run: |
          linter src/github.com/isovalent/cilium/.github/ariane-config.yaml src/github.com/isovalent/cilium/.github/ariane-config-enterprise.yaml

  merge-upload-and-status:
    name: Merge Upload and Status
    if: ${{ always() }}
    needs: lint-ariane-enterprise-config
    uses: ./.github/workflows/common-post-jobs.yaml
    secrets: inherit
    with:
      context-ref: ${{ inputs.context-ref || github.sha }}
      sha: ${{ inputs.SHA || github.sha }}
      success: ${{ needs.lint-ariane-enterprise-config.result == 'success' }}
